[package]
name = "wwo-map-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "vulkan-portability"] }
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.17"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wwo-character-core = { path = "../character-core" }

[profile.release]
strip = true
