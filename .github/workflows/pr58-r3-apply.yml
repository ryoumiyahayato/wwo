name: PR58 R3 apply

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/vnext-military-strategy-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vnext-military-strategy-20260809
          fetch-depth: 0
      - name: Execute reviewed patch block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr58-r3-patcher.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply R3 findings'
          start = source.index(marker)
          run_index = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
          body = []
          for line in source[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(body) + '\n'
          Path('/tmp/pr58-r3-apply.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/pr58-r3-apply.sh
          git diff --check
      - name: Commit normal fast-forward fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr58-r3-apply.yml .github/workflows/pr58-r3-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close PR58 R3 military findings"
          git push origin HEAD:feat/vnext-military-strategy-20260809