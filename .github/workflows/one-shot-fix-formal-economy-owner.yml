name: One-shot fix Formal economy owner

on:
  push:
    branches:
      - feature/formal-person-overlay-integration-20260908
    paths:
      - ".github/workflows/one-shot-fix-formal-economy-owner.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/formal-person-overlay-integration-20260908
          fetch-depth: 0
      - name: Apply exact source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/formal/formal_world_simulation.gd')
          text = path.read_text(encoding='utf-8')
          old = '\teconomy = candidate._economy\n'
          new = '\t_economy = candidate._economy\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one economy owner assignment, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/one-shot-fix-formal-economy-owner.yml').unlink()
          PY
          git diff --check
          git diff --exit-code -- scripts/formal/formal_world_simulation.gd && exit 1 || true
          grep -F $'\t_economy = candidate._economy' scripts/formal/formal_world_simulation.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/formal/formal_world_simulation.gd .github/workflows/one-shot-fix-formal-economy-owner.yml
          git commit -m 'fix: adopt restored economy owner'
          git push origin HEAD:feature/formal-person-overlay-integration-20260908
