name: Apply economic closure integration

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/apply-economic-closure-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/economic-closure-network
      - name: Integrate closure service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/alpha/alpha_simulation_service.gd')
          text = path.read_text(encoding='utf-8')

          declaration = 'var economic_closure := AlphaEconomicClosureService.new()\n'
          if declaration not in text:
              anchor = 'var commodity_market := AlphaCommodityMarketService.new()\n'
              assert anchor in text
              text = text.replace(anchor, anchor + declaration, 1)

          configure = '\tif not economic_closure.configure(economy, commodity_market, enterprise, labor):\n\t\treturn _fail_alpha("经济闭环服务初始化失败：%s" % economic_closure.initialization_error)\n'
          if configure not in text:
              anchor = '\t\treturn _fail_alpha("企业服务初始化失败")\n'
              assert anchor in text
              text = text.replace(anchor, anchor + configure, 1)

          settlement = '\t\tvar closure_result: Dictionary = economic_closure.settle_day(total_hour)\n\t\tif not bool(closure_result.get("success", false)):\n\t\t\t_append_alpha_event({\n\t\t\t\t"event_id": "event:economic_closure_failure:%d" % total_hour,\n\t\t\t\t"total_hour": total_hour,\n\t\t\t\t"fact_type": "economic_closure_failure",\n\t\t\t\t"summary": "商品实物流、现金、企业、劳动或运输结算失败。",\n\t\t\t\t"requires_decision": true,\n\t\t\t})\n'
          if settlement not in text:
              anchor = '\t\tvar market_result: Dictionary = commodity_market.settle_day(total_hour)\n'
              assert anchor in text
              text = text.replace(anchor, anchor + settlement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alpha/alpha_simulation_service.gd
          if ! git diff --cached --quiet; then
            git commit -m "integrate economic closure into daily simulation"
            git push origin HEAD:agent/economic-closure-network
          fi
