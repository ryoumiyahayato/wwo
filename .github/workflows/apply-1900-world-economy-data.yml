name: Apply bounded 1900 world economy data

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/apply-1900-world-economy-data.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/economy-integration-phase2
          fetch-depth: 0
      - name: Generate and integrate bounded world data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_1900_world_economy_estimates.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = Path('scripts/alpha/alpha_config.gd')
          text = config.read_text(encoding='utf-8')
          path_anchor = '\t"economy_integration": "res://data/alpha/economy_integration_1900.json",\n'
          path_add = path_anchor + '\t"historical_world_economy": "res://data/alpha/historical_world_economy_1900.json",\n\t"historical_household_budgets": "res://data/alpha/historical_household_budgets_1900.json",\n\t"historical_transport_network": "res://data/alpha/historical_transport_network_1900.json",\n'
          if '"historical_world_economy"' not in text:
              if path_anchor not in text:
                  raise SystemExit('AlphaConfig PATHS anchor missing')
              text = text.replace(path_anchor, path_add, 1)
          accessor_anchor = 'func politics() -> Dictionary:\n'
          accessors = '''func historical_world_economy() -> Dictionary:
          \treturn get_document("historical_world_economy")


          func historical_household_budgets() -> Dictionary:
          \treturn get_document("historical_household_budgets")


          func historical_transport_network() -> Dictionary:
          \treturn get_document("historical_transport_network")


          '''
          if 'func historical_world_economy()' not in text:
              if accessor_anchor not in text:
                  raise SystemExit('AlphaConfig accessor anchor missing')
              text = text.replace(accessor_anchor, accessors + accessor_anchor, 1)
          config.write_text(text, encoding='utf-8')

          integration_path = Path('data/alpha/economy_integration_1900.json')
          integration = json.loads(integration_path.read_text(encoding='utf-8'))
          integration['scope_notice_zh'] = '统一结算机制继续使用八地区Alpha回归；历史世界数据允许带来源、上下界和置信度的估算进入国家级校准，未达到阈值的记录只能用于全球总量。'
          integration['historical_world_adapter'] = {
              'coverage_registry_path': 'res://data/alpha/historical_world_economy_1900.json',
              'allow_bounded_estimates': True,
              'minimum_confidence_bp': 4500,
              'require_numeric_bounds': True,
              'forbid_unbounded_numeric_defaults': True,
              'modern_infrastructure_requires_historical_crosswalk': True,
          }
          integration_path.write_text(json.dumps(integration, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit = Path('tools/audit_1900_economy_integration.py')
          text = audit.read_text(encoding='utf-8')
          old = '''    adapter = integration.get("historical_world_adapter", {})
              assert adapter.get("forbid_generated_numeric_defaults") is True
              assert str(adapter.get("coverage_registry_path", "")).endswith(
                  "historical_economy_coverage_1900.json"
              )
          '''
          new = '''    adapter = integration.get("historical_world_adapter", {})
              assert adapter.get("allow_bounded_estimates") is True
              assert adapter.get("require_numeric_bounds") is True
              assert adapter.get("forbid_unbounded_numeric_defaults") is True
              assert int(adapter.get("minimum_confidence_bp", 0)) == 4500
              assert str(adapter.get("coverage_registry_path", "")).endswith(
                  "historical_world_economy_1900.json"
              )
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('integration audit adapter anchor missing')
              text = text.replace(old, new, 1)
          audit.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/alpha-commodity-economy.yml')
          text = workflow.read_text(encoding='utf-8')
          tool_anchor = '      - "tools/audit_1900_economy_integration.py"\n'
          if 'tools/audit_1900_world_economy_estimates.py' not in text:
              if tool_anchor not in text:
                  raise SystemExit('CI path anchor missing')
              text = text.replace(tool_anchor, tool_anchor + '      - "tools/audit_1900_world_economy_estimates.py"\n      - "tools/build_1900_world_economy_estimates.py"\n', 1)
          audit_anchor = '          python3 tools/audit_1900_economy_integration.py 2>&1 | tee builds/alpha-commodity/integration-static-audit.log\n'
          if 'world-economy-static-audit.log' not in text:
              if audit_anchor not in text:
                  raise SystemExit('CI audit command anchor missing')
              text = text.replace(audit_anchor, audit_anchor + '          python3 tools/audit_1900_world_economy_estimates.py 2>&1 | tee builds/alpha-commodity/world-economy-static-audit.log\n', 1)
          json_anchor = '          python3 -m json.tool data/alpha/historical_economy_coverage_1900.json >/dev/null\n'
          if 'historical_world_economy_1900.json >/dev/null' not in text:
              if json_anchor not in text:
                  raise SystemExit('CI JSON anchor missing')
              text = text.replace(json_anchor, json_anchor + '          python3 -m json.tool data/alpha/historical_world_economy_1900.json >/dev/null\n          python3 -m json.tool data/alpha/historical_household_budgets_1900.json >/dev/null\n          python3 -m json.tool data/alpha/historical_transport_network_1900.json >/dev/null\n', 1)
          workflow.write_text(text, encoding='utf-8')

          report = Path('docs/economy/1900_world_data_methodology.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('''# 1900世界经济数据方法

本数据层覆盖50个可玩政治实体，并用8个残余汇总项将世界人口总量闭合到约16.49亿。50国记录可用于国家级校准；残余汇总仅用于全球总量，不生成虚假的行政区。

## 数据级别

1. **历史锚点**：Maddison人口/GDP、COW NMC人口/城市人口/钢铁/能源、CEPII贸易与关税、国家统计和铁路史料。
2. **插值或边界转换**：邻近年份线性插值；按1900政治边界组合或拆分现代国家序列。
3. **有界估算**：缺失的农业、矿产、铁路、水运和港口能力使用人口、GDP、城市化、资源禀赋和已知枢纽推导，必须保存上下界和置信度。

低于45%综合置信度的国家记录不进入正式结算。现代港口或铁路数据只能核对位置和定义，不得直接替代1900数值。

## 家庭预算

城市工人模板以1901年美国工人家庭调查为锚：2,567户有详细支出，25,440户有较宽统计；生活必需品约占总支出的79.8%。其他阶层按相邻模板中位数和恩格尔规律调整，并允许家庭层面±12%的随机差异。

## 运输图

当前为国家—枢纽级稀疏图，包含30条主要远洋蒸汽航线、13条河运走廊和50国铁路/水道总量。它用于容量和路径规划，不声称复原每条支线或港区。
''', encoding='utf-8')
          PY
          python3 tools/audit_1900_commodity_economy.py
          python3 tools/audit_1900_economy_integration.py
          python3 tools/audit_1900_world_economy_estimates.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-1900-world-economy-data.yml
          git rm -f .github/workflows/fix-economy-phase2-save-footprint.yml || true
          git add data/alpha scripts/alpha tools docs/economy .github/workflows/alpha-commodity-economy.yml
          git commit -m "import bounded 1900 world economy calibration"
          git push origin HEAD:agent/economy-integration-phase2
