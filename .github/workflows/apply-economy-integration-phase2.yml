name: Apply economy integration phase two

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/apply-economy-integration-phase2.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/economy-integration-phase2
      - name: Wire config and commodity logistics delegation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def apply(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  print(f"already applied: {label}")
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"applied: {label}")

          apply(
              "scripts/alpha/alpha_config.gd",
              '\t"commodity_market": "res://data/alpha/commodity_market_1900.json",\n\t"politics":',
              '\t"commodity_market": "res://data/alpha/commodity_market_1900.json",\n\t"economy_integration": "res://data/alpha/economy_integration_1900.json",\n\t"politics":',
              "config path",
          )
          apply(
              "scripts/alpha/alpha_config.gd",
              'func commodity_market() -> Dictionary:\n\treturn get_document("commodity_market")\n\n\nfunc politics()',
              'func commodity_market() -> Dictionary:\n\treturn get_document("commodity_market")\n\n\nfunc economy_integration() -> Dictionary:\n\treturn get_document("economy_integration")\n\n\nfunc politics()',
              "config accessor",
          )
          apply(
              "scripts/alpha/alpha_commodity_market_service.gd",
              'var _policies: Dictionary = {}\n',
              'var _policies: Dictionary = {}\nvar _external_logistics_managed: bool = false\n',
              "managed logistics state",
          )
          apply(
              "scripts/alpha/alpha_commodity_market_service.gd",
              '\tinitialization_error = ""\n\tvar document: Dictionary = config.commodity_market()',
              '\tinitialization_error = ""\n\t_external_logistics_managed = false\n\tvar document: Dictionary = config.commodity_market()',
              "managed logistics reset",
          )
          apply(
              "scripts/alpha/alpha_commodity_market_service.gd",
              'func settle_day(total_hour: int) -> Dictionary:\n',
              'func set_external_logistics_managed(enabled: bool) -> void:\n\t_external_logistics_managed = enabled\n\n\nfunc external_logistics_managed() -> bool:\n\treturn _external_logistics_managed\n\n\nfunc settle_day(total_hour: int) -> Dictionary:\n',
              "managed logistics API",
          )
          apply(
              "scripts/alpha/alpha_commodity_market_service.gd",
              '\t_run_local_consumption()\n\t_run_regional_balancing()\n\t_run_international_market()\n\t_enforce_all_warehouse_capacity()',
              '\t_run_local_consumption()\n\tif not _external_logistics_managed:\n\t\t_run_regional_balancing()\n\t\t_run_international_market()\n\t_enforce_all_warehouse_capacity()',
              "delegate logistics",
          )
          apply(
              "scripts/alpha/alpha_commodity_market_service.gd",
              '\t\t"international_exports": {},\n\t\t"spoiled": {},',
              '\t\t"international_exports": {},\n\t\t"transit_received": {},\n\t\t"transit_dispatched": {},\n\t\t"strategic_release": {},\n\t\t"spoiled": {},',
              "integration metrics",
          )
          apply(
              "scripts/alpha/alpha_economy_integration_service.gd",
              '\t_policies = (_document.get("policies", {}) as Dictionary).duplicate(true)\n\t_household_strata',
              '\t_policies = (_document.get("policies", {}) as Dictionary).duplicate(true)\n\t_commodity_market.set_external_logistics_managed(bool(\n\t\t_policies.get("external_logistics_managed", true)\n\t))\n\t_household_strata',
              "enable external logistics",
          )
          apply(
              "scripts/alpha/alpha_economy_integration_service.gd",
              'func integration_summary() -> Dictionary:\n',
              'func transport_edge_count() -> int:\n\treturn _edges_by_id.size()\n\n\nfunc integration_summary() -> Dictionary:\n',
              "route count API",
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alpha/alpha_config.gd scripts/alpha/alpha_commodity_market_service.gd scripts/alpha/alpha_economy_integration_service.gd
          git commit -m "wire economy configuration and sparse logistics delegation"
          git push origin HEAD:agent/economy-integration-phase2
