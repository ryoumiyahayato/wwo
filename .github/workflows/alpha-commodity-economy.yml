name: Alpha 1900 commodity economy

on:
  pull_request:
    branches:
      - master
    paths:
      - "project.godot"
      - "data/alpha/**"
      - "data/world_map/historical/**"
      - "scripts/alpha/**"
      - "scripts/formal/**"
      - "scenes/alpha/**"
      - "scenes/formal/**"
      - "tests/alpha/**"
      - "tests/formal/**"
      - "tools/audit_1900_commodity_economy.py"
      - "tools/audit_1900_economy_integration.py"
      - "tools/audit_1900_world_economy_compact.py"
      - "tools/build_1900_world_economy_estimates.py"
      - "tools/compact_1900_world_economy_estimates.py"
      - "tools/run_validation.ps1"
      - "docs/economy/**"
      - ".github/workflows/alpha-commodity-economy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-commodity-economy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_BIN: "${{ github.workspace }}/.ci-godot/Godot_v4.6.3-stable_linux.x86_64"
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-godot
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output .ci-godot/godot.zip
          unzip -q .ci-godot/godot.zip -d .ci-godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version
      - name: Install screenshot runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-cjk
      - name: Audit economy and historical calibration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/alpha-commodity
          python3 tools/audit_1900_commodity_economy.py 2>&1 | tee builds/alpha-commodity/commodity-static-audit.log
          python3 tools/audit_1900_economy_integration.py 2>&1 | tee builds/alpha-commodity/integration-static-audit.log
          python3 tools/audit_1900_world_economy_compact.py 2>&1 | tee builds/alpha-commodity/world-economy-static-audit.log
          python3 -m json.tool data/alpha/commodity_market_1900.json >/dev/null
          python3 -m json.tool data/alpha/economy_integration_1900.json >/dev/null
          python3 -m json.tool data/alpha/historical_world_economy_1900.json >/dev/null
          python3 -m json.tool data/alpha/historical_world_economy_1900/countries_compact.json >/dev/null
          python3 -m json.tool data/alpha/historical_household_budgets_1900.json >/dev/null
          python3 -m json.tool data/alpha/historical_transport_network_1900.json >/dev/null
          python3 -m json.tool data/alpha/historical_transport_network_1900/transport_compact.json >/dev/null
          python3 -m json.tool data/world_map/historical/political_units_1900.json >/dev/null
      - name: Import project and scan scripts
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --audio-driver Dummy --path . --editor --quit-after 4 --log-file alpha-commodity-import.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script|Could not resolve class|Could not find type|^ERROR:" alpha-commodity-import.log; then
            cat alpha-commodity-import.log
            exit 1
          fi
      - name: Run formal world and quarantined economy regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/alpha-commodity
          tests=(
            tests/formal/formal_world_integration_test.gd
            tests/formal/formal_world_long_term_balance_test.gd
            tests/alpha/alpha_historical_world_economy_data_test.gd
            tests/alpha/alpha_commodity_market_test.gd
            tests/alpha/alpha_economy_lifecycle_test.gd
            tests/alpha/alpha_labor_enterprise_test.gd
            tests/alpha/alpha_composition_smoke.gd
            tests/alpha/alpha_save_and_migration_test.gd
            tests/alpha/alpha_economy_ui_audit_test.gd
            tests/alpha/alpha_economy_integration_phase2_test.gd
            tests/alpha/alpha_ai_economy_stability_test.gd
          )
          for test_script in "${tests[@]}"; do
            name="$(basename "${test_script}" .gd)"
            log="builds/alpha-commodity/${name}.log"
            timeout --signal=TERM 420s "${GODOT_BIN}" --headless --audio-driver Dummy --path . --script "res://${test_script}" --log-file "${log}"
            if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script|Could not resolve class|Could not find type|Assertion failed|[1-9][0-9]* failures|^ERROR:" "${log}"; then
              cat "${log}"
              exit 1
            fi
          done
      - name: Capture quarantined fixture economy interface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/alpha-commodity/screenshots
          capture_path="${GITHUB_WORKSPACE}/builds/alpha-commodity/screenshots/economy-dashboard.png"
          timeout --signal=TERM 300s xvfb-run -a -s "-screen 0 1280x720x24" \
            "${GODOT_BIN}" --audio-driver Dummy --rendering-method gl_compatibility \
            --path . --windowed --resolution 1280x720 \
            res://scenes/alpha/alpha_economy_dashboard_preview.tscn \
            -- --economy-audit-capture="${capture_path}"
          test -s "${capture_path}"
          file "${capture_path}" | tee builds/alpha-commodity/economy-capture-file.log
      - name: Upload fixture economy screenshot
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-alpha-economy-ui-screenshot
          path: builds/alpha-commodity/screenshots/economy-dashboard.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-and-fixture-economy-logs
          path: |
            alpha-commodity-import.log
            builds/alpha-commodity/*.log
            builds/alpha-commodity/economy-capture-file.log
          if-no-files-found: ignore
          retention-days: 7
