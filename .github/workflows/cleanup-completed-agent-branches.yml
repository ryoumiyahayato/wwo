name: Cleanup completed agent branches

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cleanup-completed-agent-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete completed branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            agent/economy-integration-phase2
            agent/economy-audit-followup
            agent/economic-closure-network
            agent/historical-admin-top50-generalize
            agent/1900-market-economy-core
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
