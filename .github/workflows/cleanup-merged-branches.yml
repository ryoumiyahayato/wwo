name: One-time merged branch cleanup

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-non-default-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every unprotected non-master branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "wwo-one-time-branch-cleanup",
          }

          def request(url: str, method: str = "GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          branches = []
          page = 1
          while True:
              batch = request(f"https://api.github.com/repos/{repository}/branches?per_page=100&page={page}")
              if not batch:
                  break
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          retained = []
          deleted = []
          for branch in branches:
              name = str(branch.get("name", ""))
              if name == "master" or bool(branch.get("protected", False)):
                  retained.append(name)
                  continue
              encoded = urllib.parse.quote(name, safe="")
              request(f"https://api.github.com/repos/{repository}/git/refs/heads/{encoded}", method="DELETE")
              deleted.append(name)

          print("Deleted branches:", deleted)
          print("Retained branches:", retained)
          unexpected = [name for name in retained if name != "master"]
          if unexpected:
              raise SystemExit("Protected non-master branches remain and require manual deletion: " + ", ".join(unexpected))
          PY
