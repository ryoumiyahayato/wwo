name: Temporary territory source audit refresh

on:
  push:
    branches:
      - feature/production-territory-evidence-contract

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh world data audit artifacts'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-territory-evidence-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run official world-data generators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $output = Join-Path $root 'local-artifacts/world-data-audit'
          python tools/world_data/validate_world_data.py --root $root --data-root (Join-Path $root 'data/world_map') --output-dir $output --allow-errors
          if ($LASTEXITCODE -ne 0) { throw 'validate_world_data failed' }
          python tools/world_data/build_batch2_artifacts.py --root $root --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'build_batch2_artifacts failed' }
          python tools/world_data/build_batch3_contracts.py --root $root --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'build_batch3_contracts failed' }
          python tools/world_data/build_batch4_run_manifest.py --root $root --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'build_batch4_run_manifest failed' }

      - name: Update exact inventory test baselines
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              Path("tests/world_data/test_batch2_artifacts.py"): [
                  ('self.assertEqual(self.data_manifest["file_count"], 184)', 'self.assertEqual(self.data_manifest["file_count"], 185)'),
                  ('self.assertEqual(len(self.data_manifest["files"]), 184)', 'self.assertEqual(len(self.data_manifest["files"]), 185)'),
              ],
              Path("tests/world_data/test_batch3_contracts.py"): [
                  ('self.assertEqual(self.signatures["data_json_count"], 184)', 'self.assertEqual(self.signatures["data_json_count"], 185)'),
              ],
              Path("tests/world_data/test_batch4_run_manifest.py"): [
                  ('self.assertEqual(manifest["batch_results"]["batch1"]["inventory_files"], 184)', 'self.assertEqual(manifest["batch_results"]["batch1"]["inventory_files"], 185)'),
              ],
              Path("tests/world_data/test_validate_world_data.py"): [
                  ('self.assertEqual(self.result["inventory"]["file_count"], 184)', 'self.assertEqual(self.result["inventory"]["file_count"], 185)'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected baseline not found: {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Verify refreshed world-data audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests/world_data -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'world-data regression suite failed after refresh' }
          python -c "import json,pathlib; p=pathlib.Path('local-artifacts/world-data-audit/batch4_run_manifest.json'); x=json.loads(p.read_text(encoding='utf-8')); g=x['final_gates']; assert x['authoritative_source_modified'] is False; assert g['json_parse_errors']==0; assert g['loader_contract_gaps']==0; print('authoritative_source_modified=false'); print('json_parse_errors=0'); print('loader_contract_gaps=0')"

      - name: Commit official refresh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-artifacts/world-data-audit tests/world_data/test_batch2_artifacts.py tests/world_data/test_batch3_contracts.py tests/world_data/test_batch4_run_manifest.py tests/world_data/test_validate_world_data.py
          if (git diff --cached --quiet) { throw 'official generator produced no tracked changes' }
          git commit -m "chore: refresh world data audit artifacts"
          git push origin HEAD:feature/production-territory-evidence-contract
