name: Fix economy phase two ledger batching

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/fix-economy-phase2-ledger-batching.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/economy-integration-phase2
      - name: Remove ledger reindexing and batch settlement entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ledger = Path("scripts/alpha/alpha_ledger_service.gd")
          text = ledger.read_text(encoding="utf-8")
          old = '''\tif _transactions_by_key.has(idempotency_key):
          \t\tvar existing_index: int = int(_transactions_by_key[idempotency_key])
          \t\tif existing_index >= 0 and existing_index < transactions.size():
          \t\t\treturn _ok({
          \t\t\t\t"duplicate": true,
          \t\t\t\t"transaction": transactions[existing_index].duplicate(true),
          \t\t\t})
          \t\treturn _fail("duplicate_pruned_transaction", "该交易已经结算且历史摘要仍保留")
          '''
          new = '''\tif _transactions_by_key.has(idempotency_key):
          \t\tvar existing_id := str(_transactions_by_key[idempotency_key])
          \t\tif not existing_id.is_empty():
          \t\t\tfor transaction: Dictionary in transactions:
          \t\t\t\tif str(transaction.get("transaction_id", "")) == existing_id:
          \t\t\t\t\treturn _ok({
          \t\t\t\t\t\t"duplicate": true,
          \t\t\t\t\t\t"transaction": transaction.duplicate(true),
          \t\t\t\t\t})
          \t\treturn _fail("duplicate_pruned_transaction", "该交易已经结算且历史摘要仍保留")
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit("ledger duplicate lookup anchor missing")
              text = text.replace(old, new, 1)
          old = '\t_transactions_by_key[idempotency_key] = transactions.size() - 1\n'
          new = '\t_transactions_by_key[idempotency_key] = str(transaction.get("transaction_id", ""))\n'
          if new not in text:
              if old not in text:
                  raise SystemExit("ledger idempotency assignment anchor missing")
              text = text.replace(old, new, 1)
          anchor = '''func validate_balances() -> Dictionary:
          '''
          method = '''func has_transaction(transaction_id: String) -> bool:
          \tif transaction_id.begins_with("transaction:alpha:"):
          \t\tvar sequence_text := transaction_id.trim_prefix("transaction:alpha:")
          \t\tif sequence_text.is_valid_int():
          \t\t\tvar sequence := int(sequence_text)
          \t\t\treturn sequence > 0 and sequence < _next_sequence
          \tfor transaction: Dictionary in transactions:
          \t\tif str(transaction.get("transaction_id", "")) == transaction_id:
          \t\t\treturn true
          \treturn false
          
          
          func validate_balances() -> Dictionary:
          '''
          if method not in text:
              if anchor not in text:
                  raise SystemExit("ledger has_transaction insertion anchor missing")
              text = text.replace(anchor, method, 1)
          old = '''\t\tindex[key] = restored_transactions.size()
          \t\trestored_transactions.append(transaction)
          \t\trestored_order.append(key)
          '''
          new = '''\t\tindex[key] = str(transaction.get("transaction_id", ""))
          \t\trestored_transactions.append(transaction)
          \t\trestored_order.append(key)
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit("ledger restore retained index anchor missing")
              text = text.replace(old, new, 1)
          text = text.replace('index[key] = -1\n', 'index[key] = ""\n', 1)
          old = '''func _trim_history() -> void:
          \twhile transactions.size() > _history_limit:
          \t\tvar removed: Dictionary = transactions.pop_front()
          \t\tfor entry: Dictionary in removed.get("entries", []) as Array[Dictionary]:
          \t\t\tvar account_id: String = str(entry.get("account_id", ""))
          \t\t\topening_balances[account_id] = (
          \t\t\t\tint(opening_balances.get(account_id, 0))
          \t\t\t\t+ int(entry.get("delta_centimes", 0))
          \t\t\t)
          \t\t_transactions_by_key[str(removed.get("idempotency_key", ""))] = -1
          \tfor index: int in range(transactions.size()):
          \t\t_transactions_by_key[str(transactions[index].get("idempotency_key", ""))] = index
          '''
          new = '''func _trim_history() -> void:
          \twhile transactions.size() > _history_limit:
          \t\tvar removed: Dictionary = transactions.pop_front()
          \t\tfor entry: Dictionary in removed.get("entries", []) as Array[Dictionary]:
          \t\t\tvar account_id: String = str(entry.get("account_id", ""))
          \t\t\topening_balances[account_id] = (
          \t\t\t\tint(opening_balances.get(account_id, 0))
          \t\t\t\t+ int(entry.get("delta_centimes", 0))
          \t\t\t)
          \t\t_transactions_by_key[str(removed.get("idempotency_key", ""))] = ""
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit("ledger history trim anchor missing")
              text = text.replace(old, new, 1)
          old = '''\t\tif int(_transactions_by_key.get(oldest_key, -1)) < 0:
          \t\t\t_transactions_by_key.erase(oldest_key)
          '''
          new = '''\t\tif str(_transactions_by_key.get(oldest_key, "")).is_empty():
          \t\t\t_transactions_by_key.erase(oldest_key)
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit("ledger processed trim anchor missing")
              text = text.replace(old, new, 1)
          ledger.write_text(text, encoding="utf-8")

          contracts = Path("scripts/alpha/alpha_contract_service.gd")
          text = contracts.read_text(encoding="utf-8")
          old = '''func _ledger_has_transaction(transaction_id: String) -> bool:
          \tif _ledger == null:
          \t\treturn false
          \tfor transaction: Dictionary in _ledger.transactions:
          \t\tif str(transaction.get("transaction_id", "")) == transaction_id:
          \t\t\treturn true
          \treturn false
          '''
          new = '''func _ledger_has_transaction(transaction_id: String) -> bool:
          \treturn _ledger != null and _ledger.has_transaction(transaction_id)
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit("contract transaction reference anchor missing")
              text = text.replace(old, new, 1)
          contracts.write_text(text, encoding="utf-8")

          service = Path("scripts/alpha/alpha_economy_integration_service.gd")
          text = service.read_text(encoding="utf-8")
          household = '''func _settle_household_consumption(total_hour: int) -> Dictionary:
          \tvar spending := 0
          \tvar arrears := 0
          \tfor raw_region_id: Variant in region_accounts:
          \t\tvar region_id := str(raw_region_id)
          \t\tvar account := region_accounts[region_id] as Dictionary
          \t\tvar market_id := str(account.get("market_id", ""))
          \t\tvar state := _commodity_market.region_states.get(region_id, {}) as Dictionary
          \t\tvar metrics := state.get("daily_metrics", {}) as Dictionary
          \t\tvar consumed := metrics.get("consumed", {}) as Dictionary
          \t\tvar value := 0
          \t\tfor raw_commodity_id: Variant in consumed:
          \t\t\tvar commodity_id := str(raw_commodity_id)
          \t\t\tvalue += maxi(0, int(round(
          \t\t\t\tfloat(consumed[commodity_id])
          \t\t\t\t* float(_commodity_market.market_price(region_id, commodity_id))
          \t\t\t)))
          \t\tvar entries: Array[Dictionary] = []
          \t\tvar paid_total := 0
          \t\tvar region_arrears := 0
          \t\tvar allocated := 0
          \t\tfor stratum_index: int in range(_household_strata.size()):
          \t\t\tvar stratum := _household_strata[stratum_index] as Dictionary
          \t\t\tvar share := (
          \t\t\t\tvalue - allocated
          \t\t\t\tif stratum_index == _household_strata.size() - 1
          \t\t\t\telse value * int(stratum.get("budget_share_bp", 0)) / BASIS_POINTS
          \t\t\t)
          \t\t\tallocated += share
          \t\t\tvar payer_id := str((account.get("stratum_ids", []) as Array)[stratum_index])
          \t\t\tvar paid := mini(share, _economy.ledger.owner_cash(payer_id))
          \t\t\tif paid > 0:
          \t\t\t\tentries.append({"owner_id": payer_id, "delta_centimes": -paid})
          \t\t\t\tpaid_total += paid
          \t\t\tregion_arrears += share - paid
          \t\tif paid_total > 0:
          \t\t\tentries.append({"owner_id": market_id, "delta_centimes": paid_total})
          \t\t\tif not _post_owner_entries(
          \t\t\t\t"integration:household:%d:%s" % [total_hour, region_id],
          \t\t\t\ttotal_hour,
          \t\t\t\t"household_consumption",
          \t\t\t\t"地区家庭阶层合并消费结算",
          \t\t\t\tentries
          \t\t\t):
          \t\t\t\tregion_arrears += paid_total
          \t\t\t\tpaid_total = 0
          \t\taccount["last_household_spending_centimes"] = paid_total
          \t\taccount["household_arrears_centimes"] = int(
          \t\t\taccount.get("household_arrears_centimes", 0)
          \t\t) + region_arrears
          \t\tregion_accounts[region_id] = account
          \t\tspending += paid_total
          \t\tarrears += region_arrears
          \treturn {"spending_centimes": spending, "arrears_centimes": arrears}
          '''
          text, count = re.subn(
              r'func _settle_household_consumption\(total_hour: int\) -> Dictionary:.*?(?=\n\nfunc _settle_enterprises)',
              household.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("household batching function replacement failed")

          enterprise_block = '''func _settle_enterprises(total_hour: int) -> Dictionary:
          \tvar total_revenue := 0
          \tvar total_cost := 0
          \tvar total_wages := 0
          \tvar total_tax := 0
          \tvar settled_enterprises: Dictionary = {}
          \tfor raw_site_id: Variant in _commodity_market.production_sites:
          \t\tvar site_id := str(raw_site_id)
          \t\tvar site := _commodity_market.production_sites[site_id] as Dictionary
          \t\tvar enterprise_id := str(site_enterprise.get(site_id, ""))
          \t\tvar enterprise_state := _enterprise.enterprises.get(enterprise_id, {}) as Dictionary
          \t\tif enterprise_state.is_empty() or str(enterprise_state.get("status", "")) in ["bankrupt", "dissolved"]:
          \t\t\tcontinue
          \t\tvar region_id := str(site.get("region_id", ""))
          \t\tvar market_id := str((region_accounts[region_id] as Dictionary).get("market_id", ""))
          \t\tvar recipe := _commodity_market.recipes.get(str(site.get("recipe_id", "")), {}) as Dictionary
          \t\tvar batches := float(site.get("last_batches", 0.0))
          \t\tvar revenue := 0
          \t\tvar input_cost := 0
          \t\tfor output: Dictionary in DataRecordUtils.to_dictionary_array(recipe.get("outputs", [])):
          \t\t\tvar commodity_id := str(output.get("commodity_id", ""))
          \t\t\trevenue += int(round(float(output.get("units", 0.0)) * batches * float(_commodity_market.market_price(region_id, commodity_id))))
          \t\tfor input: Dictionary in DataRecordUtils.to_dictionary_array(recipe.get("inputs", [])):
          \t\t\tvar commodity_id := str(input.get("commodity_id", ""))
          \t\t\tinput_cost += int(round(float(input.get("units", 0.0)) * batches * float(_commodity_market.market_price(region_id, commodity_id))))
          \t\tvar active_workers := int(round(float(site.get("workers_capacity", 0)) * float(site.get("last_operating_bp", 0)) / float(BASIS_POINTS)))
          \t\tvar wage_rate := int((region_accounts[region_id] as Dictionary).get("wage_centimes_per_worker_day", 0))
          \t\tvar wage_cost := active_workers * wage_rate
          \t\tvar maintenance := revenue * int(_policies.get("maintenance_bp_of_revenue", 0)) / BASIS_POINTS
          \t\tvar taxable_profit := maxi(0, revenue - input_cost - wage_cost - maintenance)
          \t\tvar tax := taxable_profit * int(_policies.get("business_tax_bp", 0)) / BASIS_POINTS
          \t\t_ensure_market_liquidity(region_id, revenue, total_hour)
          \t\tvar revenue_paid := revenue <= 0 or _post_owner_entries(
          \t\t\t"integration:revenue:%d:%s" % [total_hour, site_id],
          \t\t\ttotal_hour,
          \t\t\t"commodity_sales_revenue",
          \t\t\t"生产设施商品销售收入",
          \t\t\t[
          \t\t\t\t{"owner_id": market_id, "delta_centimes": -revenue},
          \t\t\t\t{"owner_id": enterprise_id, "delta_centimes": revenue},
          \t\t\t]
          \t\t)
          \t\tvar expenses_paid := _settle_site_expenses(
          \t\t\tenterprise_id, region_id, market_id, input_cost, wage_cost,
          \t\t\tmaintenance, tax, total_hour, site_id
          \t\t)
          \t\tvar all_paid := revenue_paid and expenses_paid
          \t\t_update_site_and_enterprise_after_settlement(
          \t\t\tsite_id, enterprise_id, revenue, input_cost, wage_cost,
          \t\t\tmaintenance, tax, all_paid, total_hour
          \t\t)
          \t\ttotal_revenue += revenue if revenue_paid else 0
          \t\ttotal_cost += input_cost + wage_cost + maintenance + tax if expenses_paid else 0
          \t\ttotal_wages += wage_cost if expenses_paid else 0
          \t\ttotal_tax += tax if expenses_paid else 0
          \t\tsettled_enterprises[enterprise_id] = true
          \tfor raw_enterprise_id: Variant in settled_enterprises:
          \t\t_maybe_invest(str(raw_enterprise_id), total_hour)
          \treturn {
          \t\t"revenue_centimes": total_revenue,
          \t\t"cost_centimes": total_cost,
          \t\t"wages_centimes": total_wages,
          \t\t"tax_centimes": total_tax,
          \t\t"enterprise_count": settled_enterprises.size(),
          \t}
          
          
          func _settle_site_expenses(
          \tenterprise_id: String,
          \tregion_id: String,
          \tmarket_id: String,
          \tinput_cost: int,
          \twage_cost: int,
          \tmaintenance: int,
          \ttax: int,
          \ttotal_hour: int,
          \tsite_id: String
          ) -> bool:
          \tvar total_expense := input_cost + wage_cost + maintenance + tax
          \tif total_expense <= 0:
          \t\treturn true
          \tvar account := region_accounts[region_id] as Dictionary
          \tvar country_id := str(account.get("country_id", ""))
          \tvar treasury_id := str((country_finance[country_id] as Dictionary).get("treasury_id", ""))
          \tvar entries: Array[Dictionary] = [
          \t\t{"owner_id": enterprise_id, "delta_centimes": -total_expense},
          \t\t{"owner_id": market_id, "delta_centimes": input_cost},
          \t\t{"owner_id": CAPITAL_SUPPLIER_ID, "delta_centimes": maintenance},
          \t\t{"owner_id": treasury_id, "delta_centimes": tax},
          \t]
          \tvar allocated := 0
          \tfor stratum_index: int in range(_household_strata.size()):
          \t\tvar share := (
          \t\t\twage_cost - allocated
          \t\t\tif stratum_index == _household_strata.size() - 1
          \t\t\telse wage_cost * int((_household_strata[stratum_index] as Dictionary).get("population_bp", 0)) / BASIS_POINTS
          \t\t)
          \t\tallocated += share
          \t\tif share > 0:
          \t\t\tentries.append({
          \t\t\t\t"owner_id": str((account.get("stratum_ids", []) as Array)[stratum_index]),
          \t\t\t\t"delta_centimes": share,
          \t\t\t})
          \treturn _post_owner_entries(
          \t\t"integration:expenses:%d:%s" % [total_hour, site_id],
          \t\ttotal_hour,
          \t\t"commodity_operating_expenses",
          \t\t"生产设施原料、工资、维护与税费合并结算",
          \t\tentries
          \t)
          '''
          text, count = re.subn(
              r'func _settle_enterprises\(total_hour: int\) -> Dictionary:.*?(?=\n\nfunc _update_site_and_enterprise_after_settlement)',
              enterprise_block.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("enterprise batching function replacement failed")

          payment_pattern = re.compile(
              r'\tif not _safe_transfer\(\n\t\t"integration:shipment:escrow:%s".*?\n\t\tcountry_finance\[destination_country\] = finance\n',
              re.S,
          )
          payment_replacement = '''\tvar payment_entries: Array[Dictionary] = [
          \t\t{"owner_id": buyer_id, "delta_centimes": -(goods_value + freight + tariff + insurance)},
          \t\t{"owner_id": ESCROW_ID, "delta_centimes": goods_value},
          \t\t{"owner_id": carrier_id, "delta_centimes": freight},
          \t\t{"owner_id": INSURER_ID, "delta_centimes": insurance},
          \t]
          \tif tariff > 0:
          \t\tvar treasury_id := str((country_finance[destination_country] as Dictionary).get("treasury_id", ""))
          \t\tpayment_entries.append({"owner_id": treasury_id, "delta_centimes": tariff})
          \tif not _post_owner_entries(
          \t\t"integration:shipment:dispatch:%s" % shipment_id,
          \t\ttotal_hour,
          \t\t"commodity_shipment_dispatch",
          \t\t"商品货款托管、运输、保险与关税原子分账",
          \t\tpayment_entries
          \t):
          \t\treturn _fail("shipment_payment_failed", "运输发出结算失败")
          \tif tariff > 0:
          \t\tvar finance := country_finance[destination_country] as Dictionary
          \t\tfinance["cumulative_tariff_centimes"] = int(finance.get("cumulative_tariff_centimes", 0)) + tariff
          \t\tcountry_finance[destination_country] = finance
          '''
          text, count = payment_pattern.subn(payment_replacement.rstrip() + "\n", text, count=1)
          if count != 1:
              raise SystemExit("shipment payment batching replacement failed")

          helper_anchor = 'func _safe_transfer(\n'
          helper = '''func _post_owner_entries(
          \tkey: String,
          \ttotal_hour: int,
          \tcategory: String,
          \tdescription: String,
          \towner_entries: Array[Dictionary]
          ) -> bool:
          \tvar by_account: Dictionary = {}
          \tfor owner_entry: Dictionary in owner_entries:
          \t\tvar delta := int(owner_entry.get("delta_centimes", 0))
          \t\tif delta == 0:
          \t\t\tcontinue
          \t\tvar account_id := _economy.ledger.cash_account_id(str(owner_entry.get("owner_id", "")))
          \t\tif account_id.is_empty():
          \t\t\treturn false
          \t\tby_account[account_id] = int(by_account.get(account_id, 0)) + delta
          \tvar entries: Array[Dictionary] = []
          \tfor raw_account_id: Variant in by_account:
          \t\tvar account_id := str(raw_account_id)
          \t\tvar delta := int(by_account[account_id])
          \t\tif delta != 0:
          \t\t\tentries.append({"account_id": account_id, "delta_centimes": delta})
          \tif entries.is_empty():
          \t\treturn true
          \tif entries.size() < 2:
          \t\treturn false
          \treturn bool(_economy.ledger.post(
          \t\tkey,
          \t\ttotal_hour,
          \t\tcategory,
          \t\t"fact:%s" % key,
          \t\tentries,
          \t\tdescription
          \t).get("success", false))
          
          
          func _safe_transfer(
          '''
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit("multi-owner posting insertion anchor missing")
              text = text.replace(helper_anchor, helper, 1)
          service.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alpha/alpha_ledger_service.gd scripts/alpha/alpha_contract_service.gd scripts/alpha/alpha_economy_integration_service.gd
          git commit -m "batch unified settlements and eliminate ledger reindexing"
          git push origin HEAD:agent/economy-integration-phase2
