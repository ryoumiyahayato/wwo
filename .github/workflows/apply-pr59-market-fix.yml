name: Apply PR59 market fix (scratch only)

on:
  push:
    branches:
      - fix/pr59-vnext-validation-20260812
    paths:
      - tools/apply_pr59_market_fix.py
      - .github/workflows/apply-pr59-market-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr59-vnext-validation-20260812
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python tools/apply_pr59_market_fix.py
      - name: Verify Python validation runner self-tests
        run: python -m unittest tests/tools/test_run_vnext_validation.py
      - name: Verify patch hygiene
        shell: bash
        run: |
          git diff --check
          git diff -- scripts/vnext/economy/market_economy.gd
      - name: Commit patched market source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vnext/economy/market_economy.gd
          git diff --cached --quiet && exit 1
          git commit -m "fix: stabilize and accelerate vNext long-run validation"
          git push origin HEAD:fix/pr59-vnext-validation-20260812
