name: Temporary PR55 master sync

on:
  push:
    branches:
      - feat/vnext-location-travel-20260808

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge synced master and regenerate variable state
        shell: bash
        env:
          SYNCED_MASTER: 373900e861bfa1ab15bb59de716fb64c580e3769
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          ACTUAL_MASTER="$(git rev-parse origin/master)"
          echo "SYNCED_MASTER=$SYNCED_MASTER"
          echo "ACTUAL_MASTER=$ACTUAL_MASTER"
          if [ "$ACTUAL_MASTER" != "$SYNCED_MASTER" ]; then
            echo "master moved; refusing to sync"
            exit 41
          fi
          for required in \
            scripts/vnext/player/player_state.gd \
            scripts/vnext/player/player_action_service.gd \
            scripts/vnext/economy/personal_wallet.gd; do
            git cat-file -e "origin/master:$required" || { echo "missing required file: $required"; exit 42; }
          done
          if git merge-base --is-ancestor "$SYNCED_MASTER" HEAD; then
            echo "target master is already an ancestor; nothing to merge"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff "$SYNCED_MASTER"
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'MERGE_CONFLICT=%s\n' "${conflicts[@]}"
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "merge failed without conflict paths"
              git merge --abort || true
              exit 43
            fi
            for path in "${conflicts[@]}"; do
              case "$path" in
                docs/refactors/variable_state_audit.md|docs/refactors/variable_state_member_inventory.md)
                  ;;
                *)
                  echo "unexpected non-mechanical conflict: $path"
                  git merge --abort || true
                  exit 44
                  ;;
              esac
            done
            for path in "${conflicts[@]}"; do
              git checkout --theirs -- "$path"
              git add "$path"
            done
          else
            echo "MERGE_CONFLICT=none"
          fi

          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py

          git add \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md

          echo "Changed paths before merge commit:"
          git status --short
          git commit -m "Merge master $SYNCED_MASTER into vNext location travel"
          git push origin HEAD:feat/vnext-location-travel-20260808
