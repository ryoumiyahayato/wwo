name: Current World Batch4 Deterministic Proof

on:
  push:
    branches:
      - ci/current-world-batch4-proof-20260903

permissions:
  contents: read

jobs:
  prove-batch4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: cd0a0479789d432f9a940c4bd63f747fe9ef47b9
    steps:
      - name: Check out exact tested tree
        uses: actions/checkout@v4
        with:
          ref: cd0a0479789d432f9a940c4bd63f747fe9ef47b9
          fetch-depth: 1

      - name: Verify target and prepare independent clean contexts
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$TARGET_SHA"
          proof="$RUNNER_TEMP/current-world-batch4-proof"
          run1="$RUNNER_TEMP/wwo-proof-run1"
          run2="$RUNNER_TEMP/wwo-proof-run2"
          out1="$RUNNER_TEMP/wwo-proof-output1"
          out2="$RUNNER_TEMP/wwo-proof-output2"
          rm -rf "$proof" "$run1" "$run2" "$out1" "$out2"
          mkdir -p "$proof/tracked" "$proof/run1" "$proof/run2" "$out1" "$out2"
          cp -a "$GITHUB_WORKSPACE/." "$run1/"
          cp -a "$GITHUB_WORKSPACE/." "$run2/"
          test "$(git -C "$run1" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$run2" rev-parse HEAD)" = "$TARGET_SHA"
          {
            echo "PROOF_DIR=$proof"
            echo "RUN1_DIR=$run1"
            echo "RUN2_DIR=$run2"
            echo "OUT1_DIR=$out1"
            echo "OUT2_DIR=$out2"
          } >> "$GITHUB_ENV"

      - name: Run official generation chain independently twice
        shell: bash
        run: |
          set -euo pipefail
          run_chain() {
            root="$1"
            out="$2"
            python3 "$root/tools/world_data/validate_world_data.py" --root "$root" --data-root "$root/data/world_map" --output-dir "$out" --allow-errors
            python3 "$root/tools/world_data/build_batch2_artifacts.py" --root "$root" --output-dir "$out"
            python3 "$root/tools/world_data/build_batch3_contracts.py" --root "$root" --output-dir "$out"
            python3 "$root/tools/world_data/build_batch4_run_manifest.py" --root "$root" --output-dir "$out"
          }
          (cd "$RUN1_DIR" && run_chain "$RUN1_DIR" "$OUT1_DIR")
          (cd "$RUN2_DIR" && run_chain "$RUN2_DIR" "$OUT2_DIR")

      - name: Collect replay artifacts and build exact semantic diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/local-artifacts/world-data-audit" "$OUT1_DIR" "$OUT2_DIR" "$PROOF_DIR" <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path

          tracked_dir, run1_dir, run2_dir, proof_dir = map(Path, sys.argv[1:])
          names = (
              "batch2_asset_manifest.json",
              "batch2_asset_staging_candidates.json",
              "batch2_data_manifest.json",
              "batch2_gap_report.json",
              "batch2_regression_manifest.json",
              "batch3_gap_report.json",
              "batch3_historical_flag_coverage.json",
              "batch3_loader_contract.json",
              "batch3_record_signature_manifest.json",
              "batch3_staging_candidates.json",
              "batch4_run_manifest.json",
              "coverage.json",
              "findings.json",
              "inventory.json",
              "normalization_candidates.json",
              "staging_candidates.json",
          )

          for label, source in (("tracked", tracked_dir), ("run1", run1_dir), ("run2", run2_dir)):
              destination = proof_dir / label
              destination.mkdir(parents=True, exist_ok=True)
              for name in names:
                  shutil.copy2(source / name, destination / name)

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical(path: Path) -> bytes:
              return path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")

          def compare_json(left, right):
              added, removed, changed, scalars = [], [], [], []
              def walk(a, b, path="$"):
                  if isinstance(a, dict) and isinstance(b, dict):
                      ak, bk = set(a), set(b)
                      for key in sorted(bk - ak): added.append(f"{path}.{key}")
                      for key in sorted(ak - bk): removed.append(f"{path}.{key}")
                      for key in sorted(ak & bk): walk(a[key], b[key], f"{path}.{key}")
                      return
                  if isinstance(a, list) and isinstance(b, list):
                      common = min(len(a), len(b))
                      for i in range(common): walk(a[i], b[i], f"{path}[{i}]")
                      for i in range(common, len(b)): added.append(f"{path}[{i}]")
                      for i in range(common, len(a)): removed.append(f"{path}[{i}]")
                      return
                  if a != b:
                      changed.append(path)
                      if not isinstance(a, (dict, list)) and not isinstance(b, (dict, list)):
                          scalars.append({"path": path, "tracked_or_left": a, "generated_or_right": b})
              walk(left, right)
              return {"semantic_equal": left == right, "added_keys": added, "removed_keys": removed, "changed_keys": changed, "changed_scalar_values": scalars}

          report = {"files": {}}
          mismatches = []
          nondeterministic = []
          for name in names:
              tp = proof_dir / "tracked" / name
              p1 = proof_dir / "run1" / name
              p2 = proof_dir / "run2" / name
              t = json.loads(tp.read_text(encoding="utf-8"))
              r1 = json.loads(p1.read_text(encoding="utf-8"))
              r2 = json.loads(p2.read_text(encoding="utf-8"))
              r1r2 = compare_json(r1, r2)
              tr1 = compare_json(t, r1)
              r1r2["byte_equal"] = canonical(p1) == canonical(p2)
              tr1["byte_equal"] = canonical(tp) == canonical(p1)
              report["files"][name] = {
                  "tracked_sha256_raw": sha(tp),
                  "generated_1_sha256_raw": sha(p1),
                  "generated_2_sha256_raw": sha(p2),
                  "run1_vs_run2": r1r2,
                  "tracked_vs_run1": tr1,
              }
              if not r1r2["byte_equal"]:
                  nondeterministic.append(name)
              if not tr1["byte_equal"]:
                  mismatches.append(name)
          report["generated_run1_vs_run2_mismatches"] = nondeterministic
          report["tracked_vs_generated_mismatches"] = mismatches
          (proof_dir / "replay-artifact-semantic-diff.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
          print("GENERATED_RUN1_VS_RUN2_MISMATCHES=" + json.dumps(nondeterministic))
          print("TRACKED_VS_GENERATED_MISMATCHES=" + json.dumps(mismatches))

          b4 = report["files"]["batch4_run_manifest.json"]
          print("TRACKED_SHA=" + b4["tracked_sha256_raw"])
          print("GENERATED_1_SHA=" + b4["generated_1_sha256_raw"])
          print("GENERATED_2_SHA=" + b4["generated_2_sha256_raw"])
          with (proof_dir / "proof-env.txt").open("w", encoding="utf-8", newline="\n") as f:
              f.write("TRACKED_SHA=" + b4["tracked_sha256_raw"] + "\n")
              f.write("GENERATED_1_SHA=" + b4["generated_1_sha256_raw"] + "\n")
              f.write("GENERATED_2_SHA=" + b4["generated_2_sha256_raw"] + "\n")
          PY
          cat "$PROOF_DIR/proof-env.txt" >> "$GITHUB_ENV"

      - name: Run existing official replay test against exact target
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          python3 -B -m unittest tests.world_data.test_batch4_run_manifest.Batch4RunManifestTests.test_official_generators_replay_tracked_artifacts_and_detect_mutation >"$PROOF_DIR/official-replay-test.txt" 2>&1
          rc=$?
          cat "$PROOF_DIR/official-replay-test.txt"
          echo "OFFICIAL_REPLAY_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Write proof summary
        shell: bash
        run: |
          set -euo pipefail
          gen_equal=NO
          tracked_equal=NO
          test "$GENERATED_1_SHA" = "$GENERATED_2_SHA" && gen_equal=YES || true
          test "$GENERATED_1_SHA" = "$TRACKED_SHA" && tracked_equal=YES || true
          b4_semantic="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print("YES" if d["files"]["batch4_run_manifest.json"]["tracked_vs_run1"]["semantic_equal"] else "NO")' "$PROOF_DIR/replay-artifact-semantic-diff.json")"
          mismatches="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print(", ".join(d["tracked_vs_generated_mismatches"]))' "$PROOF_DIR/replay-artifact-semantic-diff.json")"
          cat > "$PROOF_DIR/proof-summary.txt" <<EOF
          target commit SHA: $TARGET_SHA
          tracked SHA: $TRACKED_SHA
          generated #1 SHA: $GENERATED_1_SHA
          generated #2 SHA: $GENERATED_2_SHA
          generated1 == generated2: $gen_equal
          generated == tracked: $tracked_equal
          batch4 semantic_equal tracked vs run1: $b4_semantic
          official replay return code: $OFFICIAL_REPLAY_RC
          replay mismatches: $mismatches
          generation context: two independent full filesystem copies (including .git) from exact target checkout; outputs in separate external temp directories
          official commands (cwd = each independent repository root):
            python3 tools/world_data/validate_world_data.py --root <root> --data-root <root>/data/world_map --output-dir <out> --allow-errors
            python3 tools/world_data/build_batch2_artifacts.py --root <root> --output-dir <out>
            python3 tools/world_data/build_batch3_contracts.py --root <root> --output-dir <out>
            python3 tools/world_data/build_batch4_run_manifest.py --root <root> --output-dir <out>
          runner OS: $(uname -a)
          Python version: $(python3 --version 2>&1)
          EOF
          cat "$PROOF_DIR/proof-summary.txt"

      - name: Upload deterministic proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-world-batch4-proof-${{ env.TARGET_SHA }}-${{ github.run_number }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce initial proof gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GENERATED_1_SHA" != "$GENERATED_2_SHA" ]; then
            echo "CLASSIFICATION=GENERATOR NONDETERMINISM"
            exit 1
          fi
          if [ "$GENERATED_1_SHA" != "$TRACKED_SHA" ]; then
            echo "CLASSIFICATION=STALE TRACKED BATCH4 ARTIFACT"
            exit 0
          fi
          if [ "$OFFICIAL_REPLAY_RC" != "0" ]; then
            echo "CLASSIFICATION=BATCH4 CURRENT; REPLAY FAILS ELSEWHERE"
            exit 1
          fi
          echo "CLASSIFICATION=TRACKED ARTIFACT CURRENT"
