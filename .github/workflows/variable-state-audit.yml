name: Variable state audit

on:
  pull_request:
    branches:
      - master
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "resources/**"
      - "data/alpha/**"
      - "data/balance/**"
      - "data/characters/**"
      - "data/scenarios/**"
      - "data/v2_2/**"
      - "data/v2_3/**"
      - "data/vnext/**"
      - "data/world/**"
      - "data/world_map/**"
      - "tests/tools/test_variable_state_discovery.py"
      - "docs/refactors/**"
      - "tools/audit_variable_state.py"
      - "tools/generate_variable_state_docs.py"
      - "tools/render_variable_state_audit_summary.py"
      - "tools/render_variable_state_member_inventory.py"
      - "tools/render_variable_refactor_plan.py"
      - ".github/workflows/variable-state-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: variable-state-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Regenerate variable state audit documents
        run: |
          set -euo pipefail
          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py
          test -s builds/variable-state-audit/variable_state_inventory.json
          test -s builds/variable-state-audit/member_inventory.md
          test -s docs/refactors/variable_state_audit.md
          test -s docs/refactors/variable_state_member_inventory.md
          test -s docs/refactors/state_ownership_matrix.md
          test -s docs/refactors/variable_refactor_plan.md

      - name: Upload regenerated audit documents
        uses: actions/upload-artifact@v4
        with:
          name: variable-state-generated-docs
          path: |
            docs/refactors/variable_state_audit.md
            docs/refactors/variable_state_member_inventory.md
            docs/refactors/state_ownership_matrix.md
            docs/refactors/variable_refactor_plan.md
          if-no-files-found: error

      - name: Verify committed audit documents are current
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
