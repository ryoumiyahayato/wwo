name: Variable state audit

on:
  pull_request:
    branches:
      - master
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "resources/**"
      - "data/alpha/**"
      - "data/balance/**"
      - "data/characters/**"
      - "data/scenarios/**"
      - "data/v2_2/**"
      - "data/v2_3/**"
      - "data/vnext/**"
      - "data/world/**"
      - "data/world_map/**"
      - "tests/tools/test_variable_state_discovery.py"
      - "docs/refactors/**"
      - "tools/audit_variable_state.py"
      - "tools/generate_variable_state_docs.py"
      - "tools/render_variable_state_audit_summary.py"
      - "tools/render_variable_state_member_inventory.py"
      - "tools/render_variable_refactor_plan.py"
      - ".github/workflows/variable-state-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: variable-state-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Regenerate Historical Provenance deterministically
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_historical_provenance_eol_contract.py
          python -B tools/provenance/generate_historical_provenance.py
          python -B tools/provenance/generate_historical_provenance.py --check
          sha256sum \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json > /tmp/provenance-first.sha256
          python -B tools/provenance/generate_historical_provenance.py
          python -B tools/provenance/generate_historical_provenance.py --check
          sha256sum \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json > /tmp/provenance-second.sha256
          diff -u /tmp/provenance-first.sha256 /tmp/provenance-second.sha256

      - name: Regenerate variable state audit documents twice
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py
          sha256sum \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md > /tmp/variable-first.sha256
          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py
          sha256sum \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md > /tmp/variable-second.sha256
          diff -u /tmp/variable-first.sha256 /tmp/variable-second.sha256

      - name: Commit explicitly armed generated refresh
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore: run deterministic generated refresh" ]; then
            echo "generated refresh commit step is not armed"
            exit 0
          fi
          python - <<'PY'
          import subprocess

          allowed = {
              "data/provenance/historical_source_registry.json",
              "data/provenance/historical_fact_evidence.json",
              "docs/refactors/variable_state_audit.md",
              "docs/refactors/variable_state_member_inventory.md",
              "docs/refactors/state_ownership_matrix.md",
              "docs/refactors/variable_refactor_plan.md",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected generated refresh delta: {sorted(unexpected)}")
          if not changed:
              raise SystemExit("generated refresh produced no tracked delta")
          print("generated refresh delta:", sorted(changed))
          PY
          git add -- \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
          python - <<'PY'
          import subprocess

          allowed = {
              "data/provenance/historical_source_registry.json",
              "data/provenance/historical_fact_evidence.json",
              "docs/refactors/variable_state_audit.md",
              "docs/refactors/variable_state_member_inventory.md",
              "docs/refactors/state_ownership_matrix.md",
              "docs/refactors/variable_refactor_plan.md",
          }
          staged = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if not staged or not staged <= allowed:
              raise SystemExit(f"invalid staged generated refresh set: {sorted(staged)}")
          print("staged generated refresh:", sorted(staged))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh deterministic generated state"
          git push origin HEAD:canonical/current-world

      - name: Verify committed audit documents are current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
