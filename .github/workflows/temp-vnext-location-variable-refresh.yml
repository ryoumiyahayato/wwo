name: Temporary vNext location variable refresh

on:
  push:
    branches:
      - feat/vnext-location-travel-20260808

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh variable-state documents
        shell: python
        run: |
          from pathlib import Path

          audit_path = Path("docs/refactors/variable_state_audit.md")
          audit = audit_path.read_text(encoding="utf-8")
          replacements = {
              "- 1,609个生产成员字段的静态逐项索引由[`variable_state_member_inventory.md`](variable_state_member_inventory.md)单独持有。":
                  "- 1,616个生产成员字段的静态逐项索引由[`variable_state_member_inventory.md`](variable_state_member_inventory.md)单独持有。",
              "- 扫描范围为516个源/配置文件、268个GDScript文件。":
                  "- 扫描范围为520个源/配置文件、272个GDScript文件。",
              "| 生产成员字段 | 1,613 | 1,609 | -1 |":
                  "| 生产成员字段 | 1,613 | 1,616 | -1 |",
              "| 可写成员字段 | 1,243 | 1,234 | -1 |":
                  "| 可写成员字段 | 1,243 | 1,240 | -1 |",
              "| K类、不得修改字段 | 885 | 879 | 0 |":
                  "| K类、不得修改字段 | 885 | 885 | 0 |",
          }
          for old, new in replacements.items():
              if old not in audit:
                  raise SystemExit(f"audit refresh marker missing: {old}")
              audit = audit.replace(old, new, 1)
          audit_path.write_text(audit, encoding="utf-8")

          inventory_path = Path("docs/refactors/variable_state_member_inventory.md")
          inventory = inventory_path.read_text(encoding="utf-8")
          old_metrics = "|1609|1234|15|0|1233|5|32|16|60|879|516|268|"
          new_metrics = "|1616|1240|15|0|1233|5|32|16|60|885|520|272|"
          if old_metrics not in inventory:
              raise SystemExit("member inventory metrics marker missing")
          inventory = inventory.replace(old_metrics, new_metrics, 1)
          old_heading = "## 1,609个生产成员字段逐项表"
          if old_heading not in inventory:
              raise SystemExit("member inventory heading marker missing")
          inventory = inventory.replace(old_heading, "## 1,616个生产成员字段逐项表", 1)

          marker = "@ scripts/vnext/world_runtime.gd | VNextWorldRuntime\n4 C SNAPSHOT_SCHEMA_ID\n6 K _total_minutes"
          insertion = """@ scripts/vnext/travel/location_state.gd | VNextLocationState
          4 C SNAPSHOT_SCHEMA_ID
          6 K _player_id
          7 K _place_id
          @ scripts/vnext/travel/travel_quote.gd | VNextTravelQuote
          4 K _origin_place_id
          5 K _destination_place_id
          6 K _duration_minutes
          7 K _cost_minor
          """.replace("          ", "") + marker
          if marker not in inventory:
              raise SystemExit("vNext inventory insertion marker missing")
          inventory = inventory.replace(marker, insertion, 1)
          inventory_path.write_text(inventory, encoding="utf-8")

      - name: Commit refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/refactors/variable_state_audit.md docs/refactors/variable_state_member_inventory.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh variable state for vnext travel"
          git push
