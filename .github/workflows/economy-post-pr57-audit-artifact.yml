name: Economy Post-PR57 Audit Blob Transfer

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer-generated-audit-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download validated generator artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9110466241/zip" \
            -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test "$(tr -d '\r\n' < artifact/source-head.txt)" = "4eb395919e3718800647e30c22de972448d79df8"
          diff -u artifact/first.sha256 artifact/second.sha256
          grep -Fx " M docs/refactors/variable_state_audit.md" artifact/status.txt
          grep -Fx " M docs/refactors/variable_state_member_inventory.md" artifact/status.txt
          test "$(wc -l < artifact/status.txt)" -eq 2

      - name: Create exact dangling Git blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_blob() {
            local rel="$1"
            local expected="$2"
            local file="artifact/docs/refactors/${rel}"
            local local_sha
            local_sha="$(git hash-object "${file}")"
            test "${local_sha}" = "${expected}"
            local payload
            payload="$(python3 - "${file}" <<'PY'
          import base64, json, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          print(json.dumps({"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"}))
          PY
          )"
            local response
            response="$(curl -sS --fail \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -d "${payload}")"
            local actual
            actual="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"${response}")"
            test "${actual}" = "${expected}"
            echo "AUDIT_BLOB_OK ${rel} ${actual}"
          }
          upload_blob variable_state_audit.md 77f83e96d0681bbe5e04c21f98c494f90010abc1
          upload_blob variable_state_member_inventory.md aecf555e653e5452608b2533d9c0d0125953c9da
