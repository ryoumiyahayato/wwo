name: Execute pending integration patch

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Persist decoder diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import traceback

          report = []
          try:
              source = Path('.github/workflows/apply-pending-integration-patch.yml').read_text(encoding='utf-8')
              report.append(f'source_chars={len(source)}')
              marker = "<<'PATCH_B64'\n"
              report.append(f'marker_index={source.find(marker)}')
              start = source.index(marker) + len(marker)
              end = source.index('\nPATCH_B64', start)
              payload_raw = source[start:end]
              payload = ''.join(payload_raw.split())
              report.append(f'payload_raw_chars={len(payload_raw)}')
              report.append(f'payload_chars={len(payload)}')
              archive = base64.b64decode(payload, validate=True)
              report.append(f'archive_bytes={len(archive)}')
              report.append(f'sha256={hashlib.sha256(archive).hexdigest()}')
              Path('/tmp/wwo_patch.zip').write_bytes(archive)
              report.append('decode=success')
          except Exception:
              report.append('decode=failure')
              report.append(traceback.format_exc())
          Path('.github/PATCH_DIAGNOSTIC.txt').write_text('\n'.join(report), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/PATCH_DIAGNOSTIC.txt
          git commit -m "debug: record pending patch decoder state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
