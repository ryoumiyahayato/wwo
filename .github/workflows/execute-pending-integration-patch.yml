name: Execute pending integration patch

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Decode and apply prepared patch
        shell: bash
        run: |
          set -eu
          python3 -c "from pathlib import Path; import base64,hashlib; s=Path('.github/workflows/apply-pending-integration-patch.yml').read_text(); m=\"<<'PATCH_B64'\\n\"; a=s.index(m)+len(m); b=s.index('\\nPATCH_B64',a); p=''.join(s[a:b].split()); z=base64.b64decode(p,validate=True); print('payload',len(p),'archive',len(z),'sha256',hashlib.sha256(z).hexdigest()); Path('/tmp/wwo_patch.zip').write_bytes(z)"
          unzip -t /tmp/wwo_patch.zip
          rm -rf /tmp/wwo_patch
          unzip -q /tmp/wwo_patch.zip -d /tmp
          test -f /tmp/wwo_patch/scripts/v2_3/v2_3_minimal_hud_overlay.gd
          rsync -a /tmp/wwo_patch/ ./
          rm -f .github/workflows/apply-pending-integration-patch.yml .github/workflows/execute-pending-integration-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate release entry HUD and home-country hierarchy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
