name: World Data Canonical Path Order Acceptance

on:
  push:
    branches:
      - ci/world-data-canonical-path-order-repair-20260906

permissions:
  contents: read

jobs:
  cross-platform-proof:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: 17d9b77ac22e218ac6ca808b48b49d1246e6adfc
      BASE_SHA: cd0a0479789d432f9a940c4bd63f747fe9ef47b9
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 17d9b77ac22e218ac6ca808b48b49d1246e6adfc
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify candidate and source-data immutability
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = git rev-parse HEAD
          Write-Host "CANDIDATE_SHA=$actual"
          if ($actual -ne $env:CANDIDATE_SHA) { throw "candidate SHA mismatch" }
          git diff --exit-code $env:BASE_SHA -- data/world_map data/provenance
          if ($LASTEXITCODE -ne 0) { throw "source data changed" }
          $count = (Get-ChildItem -Path data/world_map -Recurse -File).Count
          Write-Host "WORLD_DATA_SOURCE_FILE_COUNT=$count"

      - name: Run canonical-order regression and world-data unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B -m unittest tests.world_data.test_canonical_path_order
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests/world_data -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run official generation chain against tracked output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $dataRoot = Join-Path $root "data/world_map"
          $out = Join-Path $root "local-artifacts/world-data-audit"
          python tools/world_data/validate_world_data.py --root $root --data-root $dataRoot --output-dir $out --allow-errors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/world_data/build_batch2_artifacts.py --root $root --output-dir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/world_data/build_batch3_contracts.py --root $root --output-dir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/world_data/build_batch4_run_manifest.py --root $root --output-dir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify generated tracked tree is clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --exit-code -- local-artifacts/world-data-audit
          if ($LASTEXITCODE -ne 0) { throw "generated tracked artifacts drifted" }
          git diff --exit-code -- data/world_map data/provenance
          if ($LASTEXITCODE -ne 0) { throw "generator mutated source data" }
          $paths = @(
            "local-artifacts/world-data-audit/batch2_data_manifest.json",
            "local-artifacts/world-data-audit/batch3_record_signature_manifest.json",
            "local-artifacts/world-data-audit/batch4_run_manifest.json"
          )
          foreach ($path in $paths) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            Write-Host "SHA256 $path $hash"
          }

      - name: Run official replay contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B -m unittest tests.world_data.test_batch4_run_manifest.Batch4RunManifestTests.test_official_generators_replay_tracked_artifacts_and_detect_mutation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- local-artifacts/world-data-audit data/world_map data/provenance
          if ($LASTEXITCODE -ne 0) { throw "replay left tracked drift" }
