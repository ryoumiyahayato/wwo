name: Experimental land war resolver

on:
  workflow_dispatch:

# Extended/manual validation; automatic main PR checks live in main-validation.yml.
permissions:
  contents: read

jobs:
  isolated-experiment:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/tags/archive/godot-r68-source-20261120' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $binary = (Get-ChildItem -LiteralPath $install -Filter 'Godot_v4.6.3-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Pinned Godot executable unavailable' }
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate experiment and retained boundaries
        run: python -B experiments/war_resolver/validate.py --godot "${{ env.GODOT_BIN }}" --regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-war-resolver-evidence
          path: builds/war-resolver/*.json
