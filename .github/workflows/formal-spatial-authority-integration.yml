name: Formal Spatial authority integration

on:
  pull_request:
    branches:
      - canonical/current-world
    paths:
      - ".github/workflows/formal-spatial-authority-integration.yml"
      - "scripts/formal/**"
      - "scripts/vnext/spatial/**"
      - "scripts/vnext/territory/**"
      - "tests/formal/**"
      - "tests/vnext/**"
      - "tools/run_validation.ps1"
      - "tools/run_vnext_validation.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formal-spatial-authority-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Validation checked out $actual but expected $expected" }

      - name: Check feature diff whitespace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin canonical/current-world --no-tags
          git diff --check origin/canonical/current-world...HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Feature diff whitespace check failed' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh official world-data audit for territory registry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $output = Join-Path $root 'local-artifacts/world-data-audit'

          python tools/world_data/validate_world_data.py --root $root --data-root (Join-Path $root 'data/world_map') --output-dir $output --allow-errors
          if ($LASTEXITCODE -ne 0) { throw 'validate_world_data failed' }
          python tools/world_data/build_batch2_artifacts.py --root $root --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'build_batch2_artifacts failed' }
          python tools/world_data/build_batch3_contracts.py --root $root --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'build_batch3_contracts failed' }
          python tools/world_data/build_batch4_run_manifest.py --root $root --output-dir $output
          if ($LASTEXITCODE -ne 0) { throw 'build_batch4_run_manifest failed' }

          python -m unittest discover -s tests/world_data -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'world-data regression suite failed after refresh' }
          python -c "import json,pathlib; p=pathlib.Path('local-artifacts/world-data-audit/batch4_run_manifest.json'); x=json.loads(p.read_text(encoding='utf-8')); g=x['final_gates']; assert x['authoritative_source_modified'] is False; assert g['json_parse_errors']==0; assert g['loader_contract_gaps']==0; print('authoritative_source_modified=false'); print('json_parse_errors=0'); print('loader_contract_gaps=0')"
          if ($LASTEXITCODE -ne 0) { throw 'world-data final gates failed after refresh' }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-artifacts/world-data-audit tests/world_data/test_batch2_artifacts.py tests/world_data/test_batch3_contracts.py tests/world_data/test_batch4_run_manifest.py tests/world_data/test_validate_world_data.py
          if (git diff --cached --quiet) { throw 'official generator produced no tracked changes' }
          git commit -m "chore: refresh world data audit artifacts"
          git push origin HEAD:feature/production-territory-evidence-contract

      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $binary = (Get-ChildItem -LiteralPath $install -Filter 'Godot_v4.6.3-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot 4.6.3 executable was not found' }
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version

      - name: Prepare isolated user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userDataRoot = Join-Path $env:RUNNER_TEMP 'formal-spatial-authority-user-data'
          if (Test-Path -LiteralPath $userDataRoot) { Remove-Item -LiteralPath $userDataRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $userDataRoot | Out-Null
          "APPDATA=$userDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path builds/formal-spatial-authority | Out-Null

      - name: Prime Godot script class cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--editor', '--path', '.', '--quit'
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Godot project import failed with exit code $($process.ExitCode)"
          }

      - name: Run Formal Spatial authority integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-spatial-authority/formal_spatial_authority_integration.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--audio-driver', 'Dummy', '--path', '.',
            '--script', 'res://tests/formal/formal_spatial_authority_integration_test.gd',
            '--log-file', $logPath
          ) -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Formal Spatial authority integration failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal Spatial authority integration: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Formal Spatial authority zero-failure summary is missing'
          }
          if ($content -notmatch 'FORMAL_SPATIAL_AUTHORITY_INTEGRATION_COMPLETE=1') {
            throw 'Formal Spatial authority completion marker is missing'
          }

      - name: Run Formal Spatial persistence integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-spatial-authority/formal_spatial_persistence_integration.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--audio-driver', 'Dummy', '--path', '.',
            '--script', 'res://tests/formal/formal_spatial_persistence_integration_test.gd',
            '--log-file', $logPath
          ) -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Formal Spatial persistence integration failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal Spatial persistence integration: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Formal Spatial persistence zero-failure summary is missing'
          }
          if ($content -notmatch 'FORMAL_SPATIAL_PERSISTENCE_INTEGRATION_COMPLETE=1') {
            throw 'Formal Spatial persistence completion marker is missing'
          }

      - name: Run vNext focused validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/run_vnext_validation.py --root . --godot "$env:GODOT_BIN" --suite focused
          if ($LASTEXITCODE -ne 0) { throw "vNext focused validation failed with exit code $LASTEXITCODE" }

      - name: Run Formal exact persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-spatial-authority/formal_exact_persistence.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--path', '.',
            '--script', 'res://tests/formal/formal_exact_persistence_roundtrip_test.gd',
            '--log-file', $logPath
          ) -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Formal exact persistence failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal Exact Persistence: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Formal exact persistence zero-failure summary is missing'
          }
          if ($content -notmatch 'FORMAL_EXACT_PERSISTENCE_COMPLETE=1') {
            throw 'Formal exact persistence completion marker is missing'
          }

      - name: Run Military integration regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-spatial-authority/formal_military_integration.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--audio-driver', 'Dummy', '--path', '.',
            '--script', 'res://tests/formal/formal_military_authorized_defend_integration_test.gd',
            '--log-file', $logPath
          ) -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Military integration regression failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal Military authorized DEFEND integration: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Military integration zero-failure summary is missing'
          }

      - name: Run Person overlay integration regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-spatial-authority/formal_person_overlay_integration.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--audio-driver', 'Dummy', '--path', '.',
            '--script', 'res://tests/formal/formal_person_overlay_integration_test.gd',
            '--log-file', $logPath
          ) -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Person overlay integration regression failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal person overlay integration: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Person overlay integration zero-failure summary is missing'
          }

      - name: Run full repository validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -ExecutionPolicy Bypass -File tools/run_validation.ps1 -GodotPath $env:GODOT_BIN 2>&1 | Tee-Object -FilePath builds/formal-spatial-authority/full-validation.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Full validation failed with exit code $exitCode" }

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-spatial-authority-validation
          path: builds/formal-spatial-authority/*.log
          if-no-files-found: warn
