name: PR64 reconcile after PR61

on:
  push:
    branches:
      - chore/data-asset-provenance-20260812
    paths:
      - ".github/workflows/pr64-reconcile-after-pr61.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR64 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/data-asset-provenance-20260812

      - name: Merge master and regenerate provenance artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          base_sha="$(git rev-parse origin/master)"

          git merge --no-ff origin/master -m "Merge master into PR #64 after PR #61"

          python3 tools/provenance/generate_manifest.py --base-revision "$base_sha"
          python3 tools/provenance/scan_reference_matrix.py --base-revision "$base_sha"
          python3 tools/provenance/generate_regression_corpus.py --base-revision "$base_sha"
          python3 tools/provenance/generate_review_backlog.py --base-revision "$base_sha"

          python3 tools/provenance/validate_manifest.py docs/data_sources/provenance_manifest.json
          python3 tools/provenance/validate_reference_matrix.py docs/data_sources/provenance_reference_matrix.json
          python3 tools/provenance/validate_regression_corpus.py tests/provenance/provenance_regression_corpus.json
          python3 tools/provenance/validate_review_backlog.py tests/provenance/provenance_review_backlog.json
          python3 -m unittest discover -s tests/provenance -p 'test_*.py'
          python3 -m compileall -q tools/provenance tests/provenance

          git add \
            docs/data_sources/provenance_manifest.json \
            docs/data_sources/provenance_reference_matrix.json \
            tests/provenance/provenance_regression_corpus.json \
            tests/provenance/provenance_review_backlog.json

          python3 tools/provenance/generate_manifest.py --base-revision "$base_sha"
          python3 tools/provenance/scan_reference_matrix.py --base-revision "$base_sha"
          python3 tools/provenance/generate_regression_corpus.py --base-revision "$base_sha"
          python3 tools/provenance/generate_review_backlog.py --base-revision "$base_sha"
          git diff --exit-code -- \
            docs/data_sources/provenance_manifest.json \
            docs/data_sources/provenance_reference_matrix.json \
            tests/provenance/provenance_regression_corpus.json \
            tests/provenance/provenance_review_backlog.json

          rm .github/workflows/pr64-reconcile-after-pr61.yml
          git add -A .github/workflows/pr64-reconcile-after-pr61.yml
          git diff --check

          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate provenance after PR #61"
          fi
          git push origin HEAD:chore/data-asset-provenance-20260812
