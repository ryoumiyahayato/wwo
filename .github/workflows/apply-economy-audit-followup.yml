name: Apply economy audit follow-up

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/apply-economy-audit-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/economy-audit-followup
      - name: Apply source-backed navigation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('scripts/ui_spikes/holographic_workspace/holographic_workspace_historical_admin_runtime.gd')
          text = runtime.read_text(encoding='utf-8')
          method = '''func _legacy_navigation_key(entity_id: String, gwcode: int) -> String:
          \tvar profile := _major_state_profile_by_entity.get(entity_id, {}) as Dictionary
          \tfor alias_value: Variant in (profile.get("aliases", []) as Array):
          \t\tvar alias := str(alias_value).strip_edges().to_upper()
          \t\tif alias.length() == 3:
          \t\t\treturn alias
          \treturn super._legacy_navigation_key(entity_id, gwcode)


          '''
          if method not in text:
              anchor = 'func _home_historical_entity_id() -> String:\n'
              if anchor not in text:
                  raise SystemExit('historical navigation insertion anchor missing')
              runtime.write_text(text.replace(anchor, method + anchor, 1), encoding='utf-8')

          probe = Path('scripts/ui_spikes/holographic_workspace/holographic_workspace_admin1_probe.gd')
          text = probe.read_text(encoding='utf-8')
          old = '''\tvar russian_territories: Array = (workspace.get("_history_territories_by_entity") as Dictionary).get("russian_empire", []) as Array
          \tif not _require(russian_territories.size() >= 12, "俄罗斯帝国没有聚合足够的辖区"):
          \t\treturn
          '''
          new = '''\tvar russian_territories: Array = (workspace.get("_history_territories_by_entity") as Dictionary).get("russian_empire", []) as Array
          \tif not _require(
          \t\trussian_territories.size() == 1
          \t\tand str((russian_territories[0] as Dictionary).get("iso_a3", "")) == "RUS",
          \t\t"俄罗斯帝国本土没有保持为CShapes历史政治核心"
          \t):
          \t\treturn
          \tvar dated_units: Array = (workspace.get("_dated_units_document") as Dictionary).get("units", []) as Array
          \tvar russian_protected_units := 0
          \tfor unit_value: Variant in dated_units:
          \t\tvar unit := unit_value as Dictionary
          \t\tif str(unit.get("controller_id", "")) == "russian_empire":
          \t\t\trussian_protected_units += 1
          \tif not _require(russian_protected_units >= 2, "俄罗斯保护国没有作为独立历史政治单元保留"):
          \t\treturn
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('admin1 Russia assertion anchor missing')
              probe.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ui_spikes/holographic_workspace/holographic_workspace_historical_admin_runtime.gd scripts/ui_spikes/holographic_workspace/holographic_workspace_admin1_probe.gd
          git commit -m "fix source-backed historical territory navigation"
          git push origin HEAD:agent/economy-audit-followup