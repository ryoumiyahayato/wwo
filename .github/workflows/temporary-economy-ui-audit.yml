name: Temporary economy UI audit export

on:
  pull_request:
    branches:
      - agent/historical-admin-top50-generalize
    paths:
      - ".github/workflows/temporary-economy-ui-audit.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current branch
        run: zip -qr wwo-economy-ui-audit-source.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: wwo-economy-ui-audit-source
          path: wwo-economy-ui-audit-source.zip
          retention-days: 1
