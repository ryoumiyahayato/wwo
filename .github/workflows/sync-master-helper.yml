name: Temporary master sync helper

on:
  push:
    branches:
      - agent/sync-master-helper

permissions:
  contents: write

jobs:
  inspect-merge:
    if: github.event.head_commit.message != 'ci: record master synchronization conflicts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed synchronization branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-master-into-formal-integration
          fetch-depth: 0

      - name: Verify fixed refs and record merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_MASTER="92bbf22d05d8f1ba31fc2559f8b41d01a002e823"
          readonly EXPECTED_INTEGRATION="8f6be5f5b41b9e00e10ebd998c45740327da966e"
          readonly EXPECTED_BASE="b24135afc622581ee19e378391cb7616689258aa"
          readonly REPORT="/tmp/master-sync-conflicts.md"

          git fetch origin master agent/formal-world-economy-integration agent/sync-master-into-formal-integration agent/sync-master-helper
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER"
          test "$(git rev-parse origin/agent/formal-world-economy-integration)" = "$EXPECTED_INTEGRATION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION"
          test "$(git merge-base origin/master origin/agent/formal-world-economy-integration)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$EXPECTED_MASTER"
          merge_status=$?
          set -e

          {
            echo "# Master synchronization merge inspection"
            echo
            echo "- Integration: \`$EXPECTED_INTEGRATION\`"
            echo "- Master: \`$EXPECTED_MASTER\`"
            echo "- Merge base: \`$EXPECTED_BASE\`"
            echo "- Merge status: \`$merge_status\`"
            echo
            echo "## Unmerged paths"
            echo '```text'
            git diff --name-only --diff-filter=U || true
            echo '```'
            echo
            echo "## Working tree status"
            echo '```text'
            git status --short
            echo '```'
          } > "$REPORT"

          git merge --abort || true
          git switch -C agent/sync-master-helper origin/agent/sync-master-helper
          mkdir -p artifacts/sync-master
          cp "$REPORT" artifacts/sync-master/conflicts.md
          git add artifacts/sync-master/conflicts.md
          git commit -m "ci: record master synchronization conflicts"
          git push origin HEAD:agent/sync-master-helper
