name: Temporary master sync helper

on:
  pull_request:
    branches:
      - agent/sync-master-into-formal-integration

permissions:
  contents: write

jobs:
  refresh-variable-docs:
    if: github.head_ref == 'agent/sync-master-helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-master-into-formal-integration
          fetch-depth: 0

      - name: Regenerate deterministic variable-state documents
        shell: bash
        run: |
          set -euxo pipefail
          readonly EXPECTED_HEAD="f94dfb87256a52d7aa51587e72f03acd2b6ae7b6"
          git fetch origin agent/sync-master-into-formal-integration
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

          python3 tools/audit_variable_state.py
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py

          git diff --check
          git diff --quiet -- \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md && {
              echo 'Expected generated document changes were not produced.' >&2
              exit 1
            }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
          git commit -m "docs: refresh variable state audit after master sync"
          git push origin HEAD:agent/sync-master-into-formal-integration
