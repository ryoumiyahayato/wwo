name: Temporary master sync cleanup

on:
  pull_request:
    branches:
      - agent/sync-master-into-formal-integration

permissions:
  contents: write

jobs:
  delete-temporary-branches:
    if: github.head_ref == 'agent/sync-master-helper'
    runs-on: ubuntu-latest
    steps:
      - name: Verify completed synchronization and delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_MASTER="92bbf22d05d8f1ba31fc2559f8b41d01a002e823"
          readonly EXPECTED_INTEGRATION="277a6d801a6eae762e4f6963ceb995a909f80bd9"
          readonly EXPECTED_PR_HEAD="bb513ebaaee8de0f613debe3c3b71a4375beb543"

          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin \
            master \
            agent/formal-world-economy-integration \
            agent/sync-master-into-formal-integration \
            agent/sync-master-helper

          test "$(git rev-parse FETCH_HEAD^{commit})" != ""
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$EXPECTED_MASTER"
          test "$(git ls-remote origin refs/heads/agent/formal-world-economy-integration | cut -f1)" = "$EXPECTED_INTEGRATION"
          git merge-base --is-ancestor "$EXPECTED_MASTER" "$EXPECTED_INTEGRATION"
          git merge-base --is-ancestor "$EXPECTED_PR_HEAD" "$EXPECTED_INTEGRATION"

          git push origin --delete \
            agent/sync-master-into-formal-integration \
            agent/sync-master-helper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
