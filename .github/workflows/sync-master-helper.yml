name: Temporary master sync helper

on:
  pull_request:
    branches:
      - agent/sync-master-into-formal-integration

permissions:
  contents: write

jobs:
  merge-fixed-master:
    if: github.head_ref == 'agent/sync-master-helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed synchronization branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-master-into-formal-integration
          fetch-depth: 0

      - name: Merge fixed master and keep retired map player deleted
        shell: bash
        run: |
          set -euxo pipefail
          readonly EXPECTED_MASTER="92bbf22d05d8f1ba31fc2559f8b41d01a002e823"
          readonly EXPECTED_INTEGRATION="8f6be5f5b41b9e00e10ebd998c45740327da966e"
          readonly EXPECTED_BASE="b24135afc622581ee19e378391cb7616689258aa"
          readonly RETIRED_MAP_PLAYER="scripts/world_map/world_map_canvas_player.gd"
          readonly STABLE_CONTRACT="tests/variable_state/formal_time_stable_contract_test.gd"

          git fetch origin master agent/formal-world-economy-integration agent/sync-master-into-formal-integration
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER"
          test "$(git rev-parse origin/agent/formal-world-economy-integration)" = "$EXPECTED_INTEGRATION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION"
          test "$(git merge-base origin/master origin/agent/formal-world-economy-integration)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$EXPECTED_MASTER"
          merge_status=$?
          set -e
          test "$merge_status" -ne 0

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          test "${#conflicts[@]}" -eq 1
          test "${conflicts[0]}" = "$RETIRED_MAP_PLAYER"

          git rm -- "$RETIRED_MAP_PLAYER"
          git status --short
          test -z "$(git diff --name-only --diff-filter=U)"
          test ! -e "$RETIRED_MAP_PLAYER"
          test -f scenes/formal/formal_world_menu.tscn
          test -f scenes/formal/formal_world_main.tscn
          grep -Fq 'const SAVE_VERSION: int = 1' scripts/save/game_save_service.gd
          git diff --quiet "$EXPECTED_INTEGRATION" -- "$STABLE_CONTRACT"
          git diff --check

          git commit -m "Merge master into formal world integration"
          readonly MERGE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_INTEGRATION"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MASTER"
          echo "MERGE_SHA=$MERGE_SHA"
          git push origin HEAD:agent/sync-master-into-formal-integration
