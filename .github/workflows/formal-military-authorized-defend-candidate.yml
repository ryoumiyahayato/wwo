name: Formal Military authorized DEFEND candidate

on:
  pull_request:
    branches:
      - canonical/current-world
    paths:
      - ".github/workflows/formal-military-authorized-defend-candidate.yml"

permissions:
  contents: write

concurrency:
  group: formal-military-authorized-defend-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-authority-integer-product-correction:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/formal-military-authorized-defend-20260912

      - name: Verify product files still match previous product HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code 9afe035475e21e603f796e7569c65aecc082da0c -- scripts/vnext/organization/organization_authority_foundation.gd tests/vnext/organization_authority_foundation_test.gd

      - name: Apply minimum optional integer correction and regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path

          source_path = Path('scripts/vnext/organization/organization_authority_foundation.gd')
          test_path = Path('tests/vnext/organization_authority_foundation_test.gd')

          source = source_path.read_text(encoding='utf-8')
          old_helper = '''func _optional_nonnegative_int(value: Variant) -> int:\n\tif typeof(value) != TYPE_INT:\n\t\treturn -2\n\treturn int(value) if int(value) >= -1 else -2\n'''
          new_helper = '''func _optional_nonnegative_int(value: Variant) -> int:\n\tif typeof(value) == TYPE_INT:\n\t\treturn int(value) if int(value) >= -1 else -2\n\tif typeof(value) != TYPE_FLOAT:\n\t\treturn -2\n\tvar candidate := float(value)\n\tif not is_finite(candidate) or candidate < -1.0 or candidate != floor(candidate):\n\t\treturn -2\n\treturn int(candidate)\n'''
          if source.count(old_helper) != 1:
              raise SystemExit(f'expected exactly one optional helper match, got {source.count(old_helper)}')
          source_path.write_text(source.replace(old_helper, new_helper, 1), encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          marker = '''\tvar fractional_revision := saved.duplicate(true)\n\tfractional_revision["revision"] = 1.5\n\t_expect_semantic_restore_rejected_atomic(restored, fractional_revision, "fractional persisted revision")\n'''
          replacement = marker + '''\n\tvar fractional_optional_valid_until := saved.duplicate(true)\n\t_snapshot_record(fractional_optional_valid_until, "delegations", "delegation_id", "delegation.persist.bob")["valid_until"] = 1.5\n\t_expect_semantic_restore_rejected_atomic(restored, fractional_optional_valid_until, "fractional persisted optional valid_until")\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'expected exactly one fractional revision marker, got {tests.count(marker)}')
          test_path.write_text(tests.replace(marker, replacement, 1), encoding='utf-8')
          '@
          $patcher = Join-Path $env:RUNNER_TEMP 'pr83_optional_integer_patch.py'
          Set-Content -LiteralPath $patcher -Value $script -Encoding utf8
          python $patcher
          git diff --check
          $changed = @(git diff --name-only)
          $expected = @(
            'scripts/vnext/organization/organization_authority_foundation.gd',
            'tests/vnext/organization_authority_foundation_test.gd'
          )
          if (($changed | Sort-Object) -join "`n" -ne ($expected | Sort-Object) -join "`n") {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          git diff -- scripts/vnext/organization/organization_authority_foundation.gd tests/vnext/organization_authority_foundation_test.gd

      - name: Commit forward product correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/vnext/organization/organization_authority_foundation.gd tests/vnext/organization_authority_foundation_test.gd
          git commit -m 'fix: normalize optional authority JSON integers'
          $newHead = (git rev-parse HEAD).Trim()
          Write-Host "NEW PRODUCT HEAD: $newHead"
          git push origin HEAD:feature/formal-military-authorized-defend-20260912
