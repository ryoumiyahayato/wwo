name: Alpha/Fixture Diagnostics

# Supplemental retained-service diagnostics only. The five-run Base/Head Alpha
# three-year gate remains the sole authoritative performance acceptance.
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: alpha-fixture-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install godot --version=4.6.3 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Chocolatey failed to install Godot: exit $LASTEXITCODE"
          }
          godot --version
      - name: Import and scan scripts
        shell: pwsh
        run: godot --editor --headless --path . --quit
      - name: Check retained interface base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path builds\diagnostics | Out-Null
          & godot --headless --path . --check-only --script res://scripts/v2_3/v2_3_minute_formal_interface_v2.gd *>&1 |
            Tee-Object -FilePath builds\diagnostics\interface-base-check.log
          if ($LASTEXITCODE -ne 0) {
            throw "retained interface base failed direct parse check: exit $LASTEXITCODE"
          }
      - name: Audit runtime code structure
        shell: pwsh
        run: |
          python tools/audit_runtime_code.py `
            --root . `
            --json-output builds/diagnostics/runtime-code-audit.json `
            --markdown-output builds/diagnostics/runtime-code-audit.md `
            --fail-on-hard-findings
          if ($LASTEXITCODE -ne 0) {
            throw "runtime code audit found duplicate class declarations or exact duplicate production scripts"
          }
      - name: Run Alpha/fixture diagnostics sequentially
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path builds\diagnostics | Out-Null
          $tests = @(
            @{ Name = 'retained-social-sandbox'; Script = 'res://tests/v2_3/v2_3_social_sandbox_test.gd'; Timeout = 220 },
            @{ Name = 'retained-social-completion'; Script = 'res://tests/v2_3/v2_3_social_sandbox_completion_test.gd'; Timeout = 120 },
            @{ Name = 'retained-survival-autonomy'; Script = 'res://tests/v2_3/v2_3_survival_autonomy_test.gd'; Timeout = 120 },
            @{ Name = 'retained-player-interface-fixture'; Script = 'res://tests/v2_3/v2_3_player_interface_test.gd'; Timeout = 120 },
            @{ Name = 'retained-city-detail-fixture'; Script = 'res://tests/v2_3/v2_3_city_detail_performance_test.gd'; Timeout = 180 },
            @{ Name = 'retained-ui-binding-fixture'; Script = 'res://tests/v2_3/v2_3_ui_binding_test.gd'; Timeout = 120 },
            @{ Name = 'retained-save-load-fixture'; Script = 'res://tests/v2_3/v2_3_save_load_test.gd'; Timeout = 120 },
            @{ Name = 'retained-performance-fixture'; Script = 'res://tests/alpha/alpha_fixture_retained_services_performance_test.gd'; Timeout = 180 }
          )
          foreach ($test in $tests) {
            Write-Host "`n=== START $($test.Name) ==="
            $stdout = Join-Path $PWD "builds\diagnostics\$($test.Name).stdout.log"
            $stderr = Join-Path $PWD "builds\diagnostics\$($test.Name).stderr.log"
            $combined = Join-Path $PWD "builds\diagnostics\$($test.Name).log"
            $started = Get-Date
            $process = Start-Process `
              -FilePath (Get-Command godot).Source `
              -ArgumentList @('--headless', '--path', '.', '--script', $test.Script) `
              -WorkingDirectory $PWD `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -NoNewWindow `
              -PassThru
            $finished = $process.WaitForExit([int]$test.Timeout * 1000)
            if (-not $finished) {
              $process.Kill($true)
              throw "$($test.Name) timed out after $($test.Timeout) seconds"
            }
            $parts = @()
            if (Test-Path $stdout) { $parts += Get-Content $stdout -Encoding UTF8 }
            if (Test-Path $stderr) { $parts += Get-Content $stderr -Encoding UTF8 }
            $parts | Set-Content -LiteralPath $combined -Encoding utf8
            $text = $parts -join "`n"
            if ($process.ExitCode -ne 0) {
              $parts | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
              throw "$($test.Name) failed with exit code $($process.ExitCode)"
            }
            if ($text -match '(?im)(SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed|[1-9][0-9]* failures)') {
              $parts | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
              throw "$($test.Name) emitted a script or assertion failure"
            }
            $summary = $parts | Where-Object { $_ -match '(checks, 0 failures|passed|PERFORMANCE)' } | Select-Object -Last 2
            $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
            $summary | ForEach-Object { Write-Host $_ }
            Write-Host "=== DONE $($test.Name) in $elapsed seconds ==="
          }
          Write-Host "`nALL ALPHA/FIXTURE DIAGNOSTICS COMPLETED"
      - name: Upload Alpha/fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Fixture-Diagnostics
          path: builds/diagnostics/*
          if-no-files-found: error
          retention-days: 7
