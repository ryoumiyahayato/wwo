name: Diagnose approved removal patch

on:
  pull_request:
    branches:
      - agent/formal-world-economy-integration

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/remove-duplicated-player-country-state'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/remove-duplicated-player-country-state

      - name: Verify patch transfer hashes
        run: |
          set -euo pipefail
          sha256sum .github/remove-country-patch/part*
          cat .github/remove-country-patch/part* > /tmp/remove-country.patch.b64
          sha256sum /tmp/remove-country.patch.b64
          base64 --decode /tmp/remove-country.patch.b64 > /tmp/remove-country.patch
          sha256sum /tmp/remove-country.patch
          git apply --check --verbose /tmp/remove-country.patch
