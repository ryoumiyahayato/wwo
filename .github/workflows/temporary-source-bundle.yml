name: Temporary source bundle

on:
  pull_request:
    branches:
      - agent/formal-world-economy-integration

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: remove-country-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
