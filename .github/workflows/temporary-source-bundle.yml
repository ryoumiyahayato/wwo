name: Finalize approved country-state removal

on:
  pull_request:
    branches:
      - agent/formal-world-economy-integration

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/remove-duplicated-player-country-state'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/remove-duplicated-player-country-state
          fetch-depth: 0

      - name: Apply approved mechanical production deletion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('scripts/character/game_session_service.gd', 'static var selected_country_id: String = ""\n', '')
          replace_exact('scripts/character/game_session_service.gd', '\tselected_country_id = "" if character == null else character.country_id\n', '', 2)
          replace_exact('scripts/character/game_session_service.gd', '\tselected_country_id = ""\n', '')
          replace_exact('scripts/character/succession_service.gd', '\tGameSessionService.selected_country_id = restored_player.country_id\n', '')
          replace_exact('scripts/save/game_save_service.gd', '\t\t"selected_country_id": GameSessionService.selected_country_id,\n', '\t\t"selected_country_id": GameSessionService.player_character.country_id,\n')
          replace_exact('scripts/save/game_save_service.gd', '\tvar selected_country_id: String = str(snapshot["selected_country_id"])\n', '\tvar saved_player_country_id: String = str(snapshot["selected_country_id"])\n')
          replace_exact('scripts/save/game_save_service.gd', '\tif not map_service.data_set.countries.has(selected_country_id):\n', '\tif not map_service.data_set.countries.has(saved_player_country_id):\n')
          replace_exact('scripts/save/game_save_service.gd', '\tif selected_country_id != restored_player.country_id:\n', '\tif saved_player_country_id != restored_player.country_id:\n')
          replace_exact('scripts/save/game_save_service.gd', '\tGameSessionService.selected_country_id = selected_country_id\n', '')
          PY

      - name: Regenerate audit documents with repository scanner
        run: |
          set -euo pipefail
          python3 tools/audit_variable_state.py
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py

      - name: Verify approved scope and scanner results
        run: |
          set -euo pipefail
          test "$(sha256sum tests/fixtures/save/current_save_v1.json | cut -d' ' -f1)" = "b366f3e84a57be8318c536f3dcb131373d7ff8b970f2f0fc12841a4e271c6bc9"
          test "$(sha256sum tests/variable_state/generate_current_save_v1_fixture.gd | cut -d' ' -f1)" = "1afe2860312a2d47f823f8e903dbd8465dbd7b29431461d78c604033022c590f"
          test "$(sha256sum tests/variable_state/variable_state_behavior_baseline_test.gd | cut -d' ' -f1)" = "02ad53ed096acb4fc05ebc4214e9f83e81f3a1cb2266eda0514e395219a33506"
          if grep -RIn --exclude-dir=.git -- 'GameSessionService.selected_country_id' .; then
            echo 'Deleted qualified runtime reference remains' >&2
            exit 1
          fi
          mapfile -t declarations < <(grep -RInE --include='*.gd' '^[[:space:]]*(static[[:space:]]+)?var[[:space:]]+selected_country_id([[:space:]:=]|$)' scripts scenes tests || true)
          test "${#declarations[@]}" -eq 1
          printf '%s\n' "${declarations[0]}" | grep -F 'scripts/ui_spikes/holographic_workspace/holographic_workspace_runtime.gd:23:'
          python3 - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path('builds/variable-state-audit/variable_state_inventory.json').read_text(encoding='utf-8'))['metrics']
          expected = {
              'member_fields_total': 1612,
              'writable_member_fields_total': 1242,
              'global_writable_fields_total': 15,
              'autoload_writable_fields_total': 0,
              'persisted_member_fields_by_static_evidence': 491,
              'ui_copy_candidates': 32,
              'cache_candidates': 16,
              'derived_member_candidates': 60,
              'unclear_member_fields': 885,
          }
          actual = {key: metrics[key] for key in expected}
          if actual != expected:
              raise SystemExit(f'audit metrics differ: expected={expected}, actual={actual}')
          print(actual)
          PY
          git diff --check

      - name: Remove temporary files and push final scope
        run: |
          set -euo pipefail
          rm -rf .github/remove-country-patch
          rm -f .github/workflows/temporary-source-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/remove-country-patch \
            .github/workflows/temporary-source-bundle.yml \
            scripts/character/game_session_service.gd \
            scripts/character/succession_service.gd \
            scripts/save/game_save_service.gd \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md
          git diff --cached --check
          git commit -m 'Remove duplicated player country state'
          git push origin HEAD:agent/remove-duplicated-player-country-state
