name: Economy Candidate Blob Transfer

on:
  pull_request:
    branches:
      - master

permissions:
  actions: read
  contents: write

jobs:
  transfer-validated-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact validated candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: economy-validated-candidate-evidence
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ryoumiyahayato/wwo
          run-id: 31488322634

      - name: Verify and upload content-addressed blobs only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path("evidence")
          expected = {
              "scripts/vnext/economy/market_economy.gd": "eb4442ebae92b578eebb2eb24e6598e7c82da4e9",
              "scripts/vnext/economy/market_route_network.gd": "8340bc5d8da7f6b3fc757a106bad08d250e7602c",
              "tests/vnext/market_economy_recovery_test.gd": "0b9f0a581c3569674950cbb2ffa7adf36b871009",
              "docs/refactors/variable_state_audit.md": "a59494676535a4ee02dd56ac027dc2f6fe1b0f86",
              "docs/refactors/variable_state_member_inventory.md": "73e6515a81b6d20c511026310ccc2b927821c0f6",
              "docs/refactors/state_ownership_matrix.md": "0e1721e46de9e5ec3b3c4e3aea946e969f17aae5",
              "docs/refactors/variable_refactor_plan.md": "268a1a0939cc32717338ca5acfe2c384c7d200c5",
          }

          source_head = (root / "economy-evidence-source-head.txt").read_text(encoding="utf-8-sig").strip()
          assert source_head == "04c231b5a3027312f843fe7c2ded6db615624f0f", source_head

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}/git/blobs"
          result: dict[str, str] = {}

          for rel, expected_sha in expected.items():
              data = (root / rel).read_bytes().replace(b"\r\n", b"\n")
              header = b"blob " + str(len(data)).encode("ascii") + b"\0"
              actual_sha = hashlib.sha1(header + data).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f"artifact blob mismatch {rel}: {actual_sha} != {expected_sha}")

              payload = json.dumps({
                  "content": base64.b64encode(data).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              req = Request(
                  api,
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(req) as response:
                  response_payload = json.load(response)
              github_sha = str(response_payload["sha"])
              if github_sha != expected_sha:
                  raise SystemExit(f"GitHub blob mismatch {rel}: {github_sha} != {expected_sha}")
              result[rel] = github_sha
              print(f"ECON_BLOB_OK {expected_sha} {rel}")

          Path("economy-blob-shas.json").write_text(
              json.dumps({"source_head": source_head, "blobs": result}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload blob SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: economy-final-blob-shas
          if-no-files-found: error
          retention-days: 7
          path: economy-blob-shas.json
