name: Economy Final Candidate Artifact

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  economy-final-artifact:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout current economy branch
        uses: actions/checkout@v4
        with:
          ref: feat/vnext-market-economy-20260809
          fetch-depth: 1

      - name: Record artifact source head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          Write-Host "ECON_ARTIFACT_SOURCE_HEAD=$head"
          $head | Out-File -FilePath economy-evidence-source-head.txt -Encoding ascii

      - name: Apply exactly the persisted validated candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          workflow = Path('.github/workflows/economy-diagnostic-compare.yml').read_text(encoding='utf-8').replace('\r\n', '\n')
          marker = '          from pathlib import Path\n'
          start = workflow.index(marker)
          end = workflow.index("          '@ | python -", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          exec(compile(script, '<economy-candidate-patch>', 'exec'), {})
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mirror final cleanup in artifact worktree
        shell: pwsh
        run: |
          $cleanupPaths = @(
            'tests/vnext/market_economy_a_patch_setup_test.gd',
            'tests/vnext/market_economy_flow_diagnostic_test.gd',
            '.github/workflows/economy-diagnostic-compare.yml',
            '.github/workflows/economy-long-term-candidate.yml',
            '.github/workflows/economy-finalize.yml'
          )
          git rm -f --ignore-unmatch -- $cleanupPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate variable-state audit baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/audit_variable_state.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_audit_summary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_member_inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_variable_state_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_refactor_plan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $auditDocs = @(
            'docs/refactors/variable_state_audit.md',
            'docs/refactors/variable_state_member_inventory.md',
            'docs/refactors/state_ownership_matrix.md',
            'docs/refactors/variable_refactor_plan.md'
          )
          foreach ($path in $auditDocs) {
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "Missing audit document: $path" }
          }
          git add -- $auditDocs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -B tools/audit_variable_state.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_audit_summary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_member_inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_variable_state_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_refactor_plan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- $auditDocs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package exact validated candidate and generated docs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --no-ext-diff -- scripts/vnext/economy/market_economy.gd scripts/vnext/economy/market_route_network.gd tests/vnext/market_economy_recovery_test.gd | Out-File -FilePath economy-validated-production.patch -Encoding utf8
          git diff --cached --no-ext-diff -- docs/refactors/variable_state_audit.md docs/refactors/variable_state_member_inventory.md docs/refactors/state_ownership_matrix.md docs/refactors/variable_refactor_plan.md | Out-File -FilePath economy-generated-audit.patch -Encoding utf8
          git status --short | Out-File -FilePath economy-evidence-status.txt -Encoding utf8
          Get-Content economy-evidence-status.txt

      - name: Upload exact final candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: economy-validated-candidate-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            economy-evidence-source-head.txt
            economy-evidence-status.txt
            economy-validated-production.patch
            economy-generated-audit.patch
            scripts/vnext/economy/market_economy.gd
            scripts/vnext/economy/market_route_network.gd
            tests/vnext/market_economy_recovery_test.gd
            docs/refactors/variable_state_audit.md
            docs/refactors/variable_state_member_inventory.md
            docs/refactors/state_ownership_matrix.md
            docs/refactors/variable_refactor_plan.md
