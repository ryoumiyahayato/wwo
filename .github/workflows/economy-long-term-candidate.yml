name: Economy Industrial Replenishment 10-Year Evidence

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  economy-long-term:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout current economy branch
        uses: actions/checkout@v4
        with:
          ref: feat/vnext-market-economy-20260809
          fetch-depth: 1

      - name: Record evidence source head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          Write-Host "ECON_EVIDENCE_SOURCE_HEAD=$head"
          $head | Out-File -FilePath economy-evidence-source-head.txt -Encoding ascii

      - name: Reuse validated candidate patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          workflow = Path('.github/workflows/economy-diagnostic-compare.yml').read_text(encoding='utf-8').replace('\r\n', '\n')
          marker = '          from pathlib import Path\n'
          start = workflow.index(marker)
          end = workflow.index("          '@ | python -", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          exec(compile(script, '<economy-candidate-patch>', 'exec'), {})
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mirror final cleanup in evidence worktree
        shell: pwsh
        run: |
          $cleanupPaths = @(
            'tests/vnext/market_economy_a_patch_setup_test.gd',
            'tests/vnext/market_economy_flow_diagnostic_test.gd',
            '.github/workflows/economy-diagnostic-compare.yml',
            '.github/workflows/economy-long-term-candidate.yml',
            '.github/workflows/economy-finalize.yml'
          )
          git rm -f --ignore-unmatch -- $cleanupPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $binary = (Get-ChildItem -LiteralPath $install -Filter 'Godot_v4.6.3-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot 4.6.3 executable was not found' }
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean import
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @('--editor','--headless','--path','.', '--quit') -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Run focused economy tests
        shell: pwsh
        run: |
          foreach ($script in @(
            'res://tests/vnext/market_economy_test.gd',
            'res://tests/vnext/market_economy_behavior_test.gd',
            'res://tests/vnext/market_economy_recovery_test.gd',
            'res://tests/vnext/market_economy_export_production_test.gd'
          )) {
            $p = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @('--headless','--path','.', '--script',$script) -NoNewWindow -Wait -PassThru
            Write-Host "ECON_EVIDENCE_FOCUSED script=$script exit=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          }

      - name: Run complete 3650-day economy test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @('--headless','--path','.', '--script','res://tests/vnext/market_economy_long_term_test.gd') -NoNewWindow -Wait -PassThru
          Write-Host "ECON_EVIDENCE_10Y exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Run unified vNext validation including 3650 days
        shell: pwsh
        run: |
          python -B tools/run_vnext_validation.py --root . --godot "$env:GODOT_BIN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository validation
        shell: pwsh
        run: |
          & ./tools/run_validation.ps1 -GodotPath $env:GODOT_BIN -ProjectPath .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regenerate variable-state audit baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/audit_variable_state.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_audit_summary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_member_inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_variable_state_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_refactor_plan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $auditDocs = @(
            'docs/refactors/variable_state_audit.md',
            'docs/refactors/variable_state_member_inventory.md',
            'docs/refactors/state_ownership_matrix.md',
            'docs/refactors/variable_refactor_plan.md'
          )
          foreach ($path in $auditDocs) {
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "Missing audit document: $path" }
          }
          git add -- $auditDocs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -B tools/audit_variable_state.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_audit_summary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_state_member_inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_variable_state_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/render_variable_refactor_plan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- $auditDocs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package validated candidate evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --no-ext-diff -- scripts/vnext/economy/market_economy.gd scripts/vnext/economy/market_route_network.gd tests/vnext/market_economy_recovery_test.gd | Out-File -FilePath economy-validated-production.patch -Encoding utf8
          git diff --cached --no-ext-diff -- docs/refactors/variable_state_audit.md docs/refactors/variable_state_member_inventory.md docs/refactors/state_ownership_matrix.md docs/refactors/variable_refactor_plan.md | Out-File -FilePath economy-generated-audit.patch -Encoding utf8
          git status --short | Out-File -FilePath economy-evidence-status.txt -Encoding utf8
          Get-Content economy-evidence-status.txt

      - name: Upload validated candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: economy-validated-candidate-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            economy-evidence-source-head.txt
            economy-evidence-status.txt
            economy-validated-production.patch
            economy-generated-audit.patch
            scripts/vnext/economy/market_economy.gd
            scripts/vnext/economy/market_route_network.gd
            tests/vnext/market_economy_recovery_test.gd
            docs/refactors/variable_state_audit.md
            docs/refactors/variable_state_member_inventory.md
            docs/refactors/state_ownership_matrix.md
            docs/refactors/variable_refactor_plan.md
