name: Main validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rust-windows:
    name: Archive Rust Windows game
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97ebaf1003c75e39679a7507a6dc7e1869e471b7
          persist-credentials: false
      - name: Build the formal game and state tool
        working-directory: rust/strategic-host
        run: cargo +stable build --release --locked --bin wwo-map-lab --bin wwo-formal-state
      - name: Pack the Windows binaries and offline population
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'wwo-rust-windows'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item rust/strategic-host/target/release/wwo-map-lab.exe -Destination $stage
          Copy-Item rust/strategic-host/target/release/wwo-formal-state.exe -Destination $stage
          ./rust/strategic-host/tools/package_population.ps1 -DataDirectory (Join-Path $stage 'data')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'wwo-rust-windows-97ebaf1003.zip')
      - name: Upload to the existing draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $draft = gh release view 'wwo-rust-archive-20261124-97ebaf1003' --json isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.targetCommitish -ne '97ebaf1003c75e39679a7507a6dc7e1869e471b7') {
            throw 'The requested draft does not target this build.'
          }
          gh release upload 'wwo-rust-archive-20261124-97ebaf1003' (Join-Path $env:RUNNER_TEMP 'wwo-rust-windows-97ebaf1003.zip')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
