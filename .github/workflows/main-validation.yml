name: Main validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check changed source and whitespace
        # PR checkout is GitHub's merge result; HEAD^1 is its main parent.
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          python3 - <<'PY'
          import ast, json, pathlib, subprocess
          changed = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=ACMR', '-z', 'HEAD^1', 'HEAD'
          ]).decode().split('\0')
          for name in filter(None, changed):
              path = pathlib.Path(name)
              if path.suffix == '.py':
                  ast.parse(path.read_text(encoding='utf-8-sig'), filename=name)
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8-sig'))
          print('Changed Python/JSON syntax and diff whitespace passed')
          PY
      - name: Check Actions syntax
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  rust-windows:
    name: Build Rust Windows game
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the formal game and state tool
        working-directory: rust/strategic-host
        run: cargo +stable build --release --locked --bin wwo-map-lab --bin wwo-formal-state
