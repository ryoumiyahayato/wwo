name: Main validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      archive_windows_game:
        description: Save the Windows game EXE to an unpublished release draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check changed source and whitespace
        # PR checkout is GitHub's merge result; HEAD^1 is its main parent.
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          python3 - <<'PY'
          import ast, json, pathlib, subprocess
          changed = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=ACMR', '-z', 'HEAD^1', 'HEAD'
          ]).decode().split('\0')
          for name in filter(None, changed):
              path = pathlib.Path(name)
              if path.suffix == '.py':
                  ast.parse(path.read_text(encoding='utf-8-sig'), filename=name)
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8-sig'))
          population = pathlib.Path('data/historical_population_1900')
          manifest_path = population / 'runtime-manifest.json'
          prior = subprocess.run(
              ['git', 'show', f'HEAD^1:{manifest_path}'], capture_output=True
          )
          if prior.returncode == 0:
              previous = json.loads(prior.stdout)
              manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              changed_paths = set(subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z', 'HEAD^1', 'HEAD'
              ]).decode().split('\0'))
              for version, assets in previous['versions'].items():
                  if manifest['versions'].get(version) != assets:
                      raise SystemExit(f'Bindings for population v{version} changed; add a new version')
                  for asset in assets.values():
                      if str(population / asset) in changed_paths:
                          raise SystemExit(f'Population v{version} asset {asset} changed; add a new version')
          print('Changed Python/JSON syntax and diff whitespace passed')
          PY
      - name: Check Actions syntax
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  rust-windows:
    name: Build Rust Windows game
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the formal game and state tool
        working-directory: rust/strategic-host
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: |
          . ./tools/wwo-build-context.ps1
          Set-WwoBuildContext $PWD.Path (Join-Path $PWD 'target') -Validation:($env:GITHUB_REF -ne 'refs/heads/main')
          cargo +stable build --release --locked --bin wwo-map-lab --bin wwo-formal-state
      - name: Stage the offline Windows build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'wwo-rust-windows'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item rust/strategic-host/target/release/wwo-map-lab.exe -Destination $stage
          Copy-Item rust/strategic-host/target/release/wwo-formal-state.exe -Destination $stage
          ./rust/strategic-host/tools/package_population.ps1 -DataDirectory (Join-Path $stage 'data')
          Copy-Item data/menu-themes -Destination (Join-Path $stage 'data') -Recurse
          Copy-Item data/city-overlays -Destination (Join-Path $stage 'data') -Recurse
      - name: Retain the Windows build in private repositories
        if: github.ref == 'refs/heads/main' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: wwo-rust-windows
          path: ${{ runner.temp }}/wwo-rust-windows
      - name: Archive the requested main Windows game in a release draft
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.archive_windows_game
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'wwo-rust-windows/wwo-map-lab.exe'
          $shortCommit = $env:GITHUB_SHA.Substring(0, 10)
          $tag = "wwo-rust-windows-$shortCommit-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh release create $tag $exe --repo $env:GITHUB_REPOSITORY --draft `
            --target $env:GITHUB_SHA --title "WWO Rust Windows $shortCommit" --notes "Main validation: $runUrl"
          if ($LASTEXITCODE) { throw 'Could not save the Windows game to an unpublished release draft.' }
