name: Temporary vNext variable docs refresh

on:
  push:
    branches:
      - feat/vnext-personal-economy-20260808
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/vnext-personal-economy-20260808

      - name: Regenerate variable state documents
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py

      - name: Commit generated documents and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-vnext-variable-doc-refresh.yml
          git add \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh variable state docs"

          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py
          git diff --exit-code -- \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md

          git push origin HEAD:feat/vnext-personal-economy-20260808
