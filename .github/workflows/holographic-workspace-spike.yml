name: Holographic workspace spike

on:
  pull_request:
    paths:
      - ".github/workflows/holographic-workspace-spike.yml"
      - "tools/build_world_admin1.py"
      - "docs/ui_spikes/holographic_workspace_spike.md"
      - "scenes/ui_spikes/holographic_workspace/**"
      - "scripts/ui_spikes/holographic_workspace/**"
      - "shaders/ui_spikes/holographic_workspace/**"
      - "data/world_map/cities.json"
      - "data/world_map/regions.json"
      - "data/world_map/world_coastlines.json"
      - "data/world_map/country_flag_palettes.json"
      - "data/world_map/institutions.json"
      - "data/world_map/characters.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.6.3"
      GODOT_BIN: "${{ github.workspace }}/.ci-godot/Godot_v4.6.3-stable_linux.x86_64"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-godot
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output .ci-godot/godot.zip
          unzip -q .ci-godot/godot.zip -d .ci-godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Install visual test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb fonts-noto-cjk
          fc-cache -f

      - name: Generate compact world admin1 data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces.geojson" \
            --output generated/ne_10m_admin_1_states_provinces.geojson
          python3 tools/build_world_admin1.py \
            generated/ne_10m_admin_1_states_provinces.geojson \
            generated/world_admin1.json
          python3 - <<'PY'
          import json
          data=json.load(open('generated/world_admin1.json', encoding='utf-8'))
          audit=data['audit']
          assert audit['region_count'] >= 4000, audit
          assert audit['country_count'] >= 180, audit
          assert audit['polygon_count'] >= 4500, audit
          print(audit)
          PY

      - name: Commit generated world admin1 data
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/world_map
          cp generated/world_admin1.json data/world_map/world_admin1.json
          if [[ -z "$(git status --porcelain -- data/world_map/world_admin1.json)" ]]; then
            echo "Generated admin1 data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world_map/world_admin1.json
          git commit -m "data: add compact global admin1 boundaries"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload generated world admin1 data
        uses: actions/upload-artifact@v4
        with:
          name: world-admin1-generated
          path: generated/world_admin1.json
          if-no-files-found: error

      - name: Import project and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" \
            --headless \
            --audio-driver Dummy \
            --path . \
            --editor \
            --quit-after 3 \
            --log-file godot-import.log
          if grep -Eq "SCRIPT ERROR|^ERROR:" godot-import.log; then
            cat godot-import.log
            exit 1
          fi

      - name: Load holographic workspace scene
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" \
            --headless \
            --audio-driver Dummy \
            --path . \
            --scene res://scenes/ui_spikes/holographic_workspace/holographic_workspace_spike.tscn \
            --quit-after 8 \
            --log-file godot-spike.log
          if grep -Eq "SCRIPT ERROR|^ERROR:" godot-spike.log; then
            cat godot-spike.log
            exit 1
          fi

      - name: Run interaction probe
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 90s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "${GODOT_BIN}" \
            --audio-driver Dummy \
            --path . \
            --rendering-method gl_compatibility \
            --scene res://scenes/ui_spikes/holographic_workspace/holographic_workspace_interaction_probe.tscn \
            --log-file godot-interaction-probe.log
          if grep -Eq "SCRIPT ERROR|^ERROR:" godot-interaction-probe.log; then
            cat godot-interaction-probe.log
            exit 1
          fi

      - name: Capture rendered workspace states
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/holographic_workspace
          timeout --signal=TERM 120s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "${GODOT_BIN}" \
            --audio-driver Dummy \
            --path . \
            --rendering-method gl_compatibility \
            --scene res://scenes/ui_spikes/holographic_workspace/holographic_workspace_capture.tscn \
            --log-file godot-capture.log
          if grep -Eq "SCRIPT ERROR|^ERROR:" godot-capture.log; then
            cat godot-capture.log
            exit 1
          fi
          test -s artifacts/holographic_workspace/00_global_twinkle_a.png
          test -s artifacts/holographic_workspace/00_global_twinkle_b.png
          test -s artifacts/holographic_workspace/01_global_flag_overview.png
          test -s artifacts/holographic_workspace/01_global_focus.png
          test -s artifacts/holographic_workspace/01_global_mid_zoom.png
          test -s artifacts/holographic_workspace/01_global_country_names.png
          test -s artifacts/holographic_workspace/01_global_france_selected.png
          test -s artifacts/holographic_workspace/02_operation_workspace.png
          test -s artifacts/holographic_workspace/03_france_region_selected.png
          test -s artifacts/holographic_workspace/04_region_layer.png
          test -s artifacts/holographic_workspace/05_city_layer.png
          region_capture_count="$(find artifacts/holographic_workspace -maxdepth 1 -type f -name '04_region_[0-9][0-9]_*.png' | wc -l)"
          test "${region_capture_count}" -eq 9

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: holographic-workspace-screenshots
          path: artifacts/holographic_workspace/*.png
          if-no-files-found: error

      - name: Upload Godot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: holographic-workspace-godot-logs
          path: |
            godot-import.log
            godot-spike.log
            godot-interaction-probe.log
            godot-capture.log
          if-no-files-found: ignore
