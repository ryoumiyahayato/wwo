name: Float Persistence Diagnostic

on:
  pull_request:
    branches:
      - canonical/current-world
    paths:
      - ".github/workflows/float-persistence-diagnostic.yml"
      - "tests/formal/float_persistence_precision_diagnostic.gd"
      - "tests/m8_atomic_json_full_precision_roundtrip_test.gd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: float-persistence-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $binary = (Get-ChildItem -LiteralPath $install -Filter 'Godot_v4.6.3-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot 4.6.3 executable was not found' }
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version

      - name: Prepare isolated user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userDataRoot = Join-Path $env:RUNNER_TEMP 'float-persistence-diagnostic-user-data'
          if (Test-Path -LiteralPath $userDataRoot) {
            Remove-Item -LiteralPath $userDataRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $userDataRoot | Out-Null
          "APPDATA=$userDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prime Godot script class cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--editor', '--path', '.', '--quit'
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Godot project import failed with exit code $($process.ExitCode)"
          }

      - name: Run 180d bit-level float diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path builds/float-persistence-diagnostic | Out-Null
          $logPath = 'builds/float-persistence-diagnostic/diagnostic.log'
          $stderrPath = 'builds/float-persistence-diagnostic/diagnostic.stderr.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--path', '.', '--script',
            'res://tests/formal/float_persistence_precision_diagnostic.gd'
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $logPath -RedirectStandardError $stderrPath
          if (Test-Path -LiteralPath $stderrPath) {
            Get-Content -LiteralPath $stderrPath | Tee-Object -FilePath $logPath -Append
          }
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) {
            throw "Float persistence diagnostic failed with exit code $($process.ExitCode)"
          }
          $log = Get-Content -LiteralPath $logPath -Raw
          if ($log -notmatch 'FLOAT_PERSISTENCE_DIAGNOSTIC_COMPLETE=2') {
            throw 'Float persistence diagnostic completion marker missing'
          }

      - name: Run focused M8 strict regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/float-persistence-diagnostic/m8-regression.log'
          $stderrPath = 'builds/float-persistence-diagnostic/m8-regression.stderr.log'
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @(
            '--headless', '--path', '.', '--script',
            'res://tests/m8_atomic_json_full_precision_roundtrip_test.gd'
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $logPath -RedirectStandardError $stderrPath
          if (Test-Path -LiteralPath $stderrPath) {
            Get-Content -LiteralPath $stderrPath | Tee-Object -FilePath $logPath -Append
          }
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -eq 0) {
            Write-Host 'M8_STRICT_REGRESSION_RESULT=PASS'
          } else {
            Write-Host "M8_STRICT_REGRESSION_RESULT=FAIL exit_code=$($process.ExitCode)"
            Write-Warning 'The strict M8 counterexample remains red; this diagnostic workflow intentionally records rather than weakens it.'
          }

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-persistence-diagnostic
          path: |
            builds/float-persistence-diagnostic/diagnostic.log
            builds/float-persistence-diagnostic/diagnostic.stderr.log
            builds/float-persistence-diagnostic/m8-regression.log
            builds/float-persistence-diagnostic/m8-regression.stderr.log
          if-no-files-found: warn
