name: One-shot deterministic generated refresh

on:
  push:
    branches:
      - canonical/current-world
    paths:
      - ".github/workflows/one-shot-generated-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: prepare deterministic generated refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact refresh head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify Historical Provenance generation is deterministic
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/provenance/generate_historical_provenance.py
          python -B tools/provenance/generate_historical_provenance.py --check
          sha256sum \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json > /tmp/provenance-first.sha256
          python -B tools/provenance/generate_historical_provenance.py
          python -B tools/provenance/generate_historical_provenance.py --check
          sha256sum \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json > /tmp/provenance-second.sha256
          diff -u /tmp/provenance-first.sha256 /tmp/provenance-second.sha256

      - name: Regenerate Variable State documents twice
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/audit_variable_state.py --root .
          python tools/render_variable_state_audit_summary.py
          python tools/render_variable_state_member_inventory.py
          python tools/generate_variable_state_docs.py
          python tools/render_variable_refactor_plan.py
          sha256sum \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md > /tmp/variable-first.sha256
          python -B tools/audit_variable_state.py --root .
          python tools/render_variable_state_audit_summary.py
          python tools/render_variable_state_member_inventory.py
          python tools/generate_variable_state_docs.py
          python tools/render_variable_refactor_plan.py
          sha256sum \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md > /tmp/variable-second.sha256
          diff -u /tmp/variable-first.sha256 /tmp/variable-second.sha256

      - name: Commit only generated repair outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "data/provenance/historical_source_registry.json",
              "data/provenance/historical_fact_evidence.json",
              "docs/refactors/variable_state_audit.md",
              "docs/refactors/variable_state_member_inventory.md",
              "docs/refactors/state_ownership_matrix.md",
              "docs/refactors/variable_refactor_plan.md",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected generated refresh delta: {sorted(unexpected)}")
          if not changed:
              raise SystemExit("generated refresh produced no tracked delta")
          print("generated refresh delta:", sorted(changed))
          PY
          git add -- \
            data/provenance/historical_source_registry.json \
            data/provenance/historical_fact_evidence.json \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
          python - <<'PY'
          import subprocess

          allowed = {
              "data/provenance/historical_source_registry.json",
              "data/provenance/historical_fact_evidence.json",
              "docs/refactors/variable_state_audit.md",
              "docs/refactors/variable_state_member_inventory.md",
              "docs/refactors/state_ownership_matrix.md",
              "docs/refactors/variable_refactor_plan.md",
          }
          staged = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if not staged or not staged <= allowed:
              raise SystemExit(f"invalid staged generated refresh set: {sorted(staged)}")
          print("staged generated refresh:", sorted(staged))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh deterministic generated state"
          git push origin HEAD:canonical/current-world
