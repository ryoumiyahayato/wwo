name: Temporary PR55 variable-state refresh

on:
  push:
    branches:
      - feat/vnext-location-travel-20260808

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate variable-state documents
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py

      - name: Commit mechanical refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md
          echo "Mechanical generator changes:"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No generated document changes"
            exit 0
          fi
          git commit -m "chore: refresh variable state after master sync"
          git push origin HEAD:feat/vnext-location-travel-20260808
