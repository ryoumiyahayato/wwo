name: PR61 reconcile after PR71

on:
  push:
    branches:
      - feat/vnext-organization-core-20260811
    paths:
      - ".github/workflows/pr61-reconcile-after-pr71.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR61 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/vnext-organization-core-20260811

      - name: Reconcile current master and regenerate official variable-state docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          set +e
          git merge --no-ff --no-commit origin/master
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              "docs/refactors/variable_state_audit.md"
              "docs/refactors/variable_state_member_inventory.md"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo "Unexpected conflict set; aborting without push."
              exit 1
            fi
            git checkout --theirs -- \
              docs/refactors/variable_state_audit.md \
              docs/refactors/variable_state_member_inventory.md
            git add \
              docs/refactors/variable_state_audit.md \
              docs/refactors/variable_state_member_inventory.md
          fi

          python3 -B tools/audit_variable_state.py --root .
          python3 tools/render_variable_state_audit_summary.py
          python3 tools/render_variable_state_member_inventory.py
          python3 tools/generate_variable_state_docs.py
          python3 tools/render_variable_refactor_plan.py

          test -s builds/variable-state-audit/variable_state_inventory.json
          test -s builds/variable-state-audit/member_inventory.md
          test -s docs/refactors/variable_state_audit.md
          test -s docs/refactors/variable_state_member_inventory.md
          test -s docs/refactors/state_ownership_matrix.md
          test -s docs/refactors/variable_refactor_plan.md

          git add \
            docs/refactors/variable_state_audit.md \
            docs/refactors/variable_state_member_inventory.md \
            docs/refactors/state_ownership_matrix.md \
            docs/refactors/variable_refactor_plan.md

          rm .github/workflows/pr61-reconcile-after-pr71.yml
          git add -A .github/workflows/pr61-reconcile-after-pr71.yml
          git diff --check

          git commit -m "Merge master into PR #61 after PR #71"
          git push origin HEAD:feat/vnext-organization-core-20260811
