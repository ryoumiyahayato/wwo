name: Bootstrap current save v1 fixture

on:
  pull_request:
    branches:
      - agent/formal-world-economy-integration
    paths:
      - ".github/workflows/bootstrap-current-save-v1-fixture.yml"
      - "tests/variable_state/generate_current_save_v1_fixture.gd"

permissions:
  contents: write

concurrency:
  group: bootstrap-current-save-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  commit-fixture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/variable-state-behavior-baseline' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/variable-state-behavior-baseline

      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $binary = (Get-ChildItem -LiteralPath $install -Filter 'Godot_v4.6.3-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot 4.6.3 executable was not found after extraction' }
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import project class cache
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @('--headless', '--editor', '--path', '.', '--quit-after', '2') -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Godot project import failed with exit code $($process.ExitCode)" }

      - name: Generate fixture through production services
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList @('--headless', '--path', '.', '--script', 'res://tests/variable_state/generate_current_save_v1_fixture.gd') -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Fixture generator failed with exit code $($process.ExitCode)" }
          $fixture = Get-ChildItem -LiteralPath (Join-Path $env:APPDATA 'Godot\app_userdata') -Filter 'current_save_v1.json' -Recurse | Select-Object -First 1
          if (-not $fixture) { throw 'Generated fixture was not found' }
          New-Item -ItemType Directory -Force -Path tests/fixtures/save | Out-Null
          Copy-Item -LiteralPath $fixture.FullName -Destination tests/fixtures/save/current_save_v1.json -Force

      - name: Commit exact generated fixture
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/fixtures/save/current_save_v1.json
          if (git diff --cached --quiet) {
            Write-Host 'Fixture already matches current production output.'
            exit 0
          }
          git commit -m 'add production-generated SAVE_VERSION 1 fixture'
          git push origin HEAD:agent/variable-state-behavior-baseline
