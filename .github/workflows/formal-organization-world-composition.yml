name: Formal organization world composition

on:
  pull_request:
    branches:
      - canonical/current-world
    paths:
      - ".github/workflows/formal-organization-world-composition.yml"
      - "data/vnext/organizations/**"
      - "data/provenance/**"
      - "data/world_map/historical/**"
      - "scripts/formal/**"
      - "scripts/vnext/organization/**"
      - "tests/formal/**"
      - "tools/run_validation.ps1"
      - "tools/run_vnext_validation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-organization-world-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Validation checked out $actual but expected $expected" }

      - name: Check feature diff whitespace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin canonical/current-world --no-tags
          git diff --check origin/canonical/current-world...HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Feature diff whitespace check failed' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $binary = (Get-ChildItem -LiteralPath $install -Filter 'Godot_v4.6.3-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot 4.6.3 executable was not found' }
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version

      - name: Prepare isolated user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userDataRoot = Join-Path $env:RUNNER_TEMP 'formal-organization-world-composition-user-data'
          if (Test-Path -LiteralPath $userDataRoot) { Remove-Item -LiteralPath $userDataRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $userDataRoot | Out-Null
          "APPDATA=$userDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path builds/formal-organization-world-composition | Out-Null

      - name: Isolate official world-data audit regeneration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'formal-organization-world-composition-world-data-audit'
          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }

          $commands = @(
            @('tools/world_data/validate_world_data.py', '--root', '.', '--data-root', 'data/world_map', '--output-dir', $output, '--allow-errors'),
            @('tools/world_data/build_batch2_artifacts.py', '--root', '.', '--output-dir', $output),
            @('tools/world_data/build_batch3_contracts.py', '--root', '.', '--output-dir', $output),
            @('tools/world_data/build_batch4_run_manifest.py', '--root', '.', '--output-dir', $output)
          )
          foreach ($command in $commands) {
            & python -B @command
            if ($LASTEXITCODE -ne 0) {
              throw "Official world-data generator failed: $($command[0]) exit code $LASTEXITCODE"
            }
          }

          @'
          import base64
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          tracked = Path("local-artifacts/world-data-audit")
          replay_artifacts = (
              "batch2_asset_manifest.json",
              "batch2_asset_staging_candidates.json",
              "batch2_data_manifest.json",
              "batch2_gap_report.json",
              "batch2_regression_manifest.json",
              "batch3_gap_report.json",
              "batch3_historical_flag_coverage.json",
              "batch3_loader_contract.json",
              "batch3_record_signature_manifest.json",
              "batch3_staging_candidates.json",
              "batch4_run_manifest.json",
              "coverage.json",
              "findings.json",
              "inventory.json",
              "normalization_candidates.json",
              "staging_candidates.json",
          )

          def canonical_bytes(path: Path) -> bytes:
              return path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")

          mismatches = [
              name
              for name in replay_artifacts
              if not (output / name).is_file()
              or canonical_bytes(output / name) != canonical_bytes(tracked / name)
          ]
          print("OFFICIAL_AUDIT_MISMATCHES=" + json.dumps(mismatches, separators=(",", ":")))
          if mismatches != ["batch3_loader_contract.json", "batch4_run_manifest.json"]:
              raise SystemExit(17)

          old3 = json.loads((tracked / "batch3_loader_contract.json").read_text(encoding="utf-8"))
          new3 = json.loads((output / "batch3_loader_contract.json").read_text(encoding="utf-8"))
          old4 = json.loads((tracked / "batch4_run_manifest.json").read_text(encoding="utf-8"))
          new4 = json.loads((output / "batch4_run_manifest.json").read_text(encoding="utf-8"))

          summary = {
              "batch3_production_script_count_before": old3.get("production_script_count"),
              "batch3_production_script_count_after": new3.get("production_script_count"),
              "batch3_script_digest_before": old3.get("script_digest"),
              "batch3_script_digest_after": new3.get("script_digest"),
              "contract_gate": new3.get("contract_gate"),
              "missing_direct_references": new3.get("missing_direct_references"),
              "missing_directory_references": new3.get("missing_directory_references"),
              "batch4_changed_top_level_fields": sorted(
                  key for key in set(old4) | set(new4) if old4.get(key) != new4.get(key)
              ),
              "batch4_authoritative_source_modified": new4.get("authoritative_source_modified"),
          }
          print("OFFICIAL_AUDIT_SUMMARY=" + json.dumps(summary, separators=(",", ":")))

          for name, marker in (
              ("batch3_loader_contract.json", "BATCH3_LOADER_CONTRACT"),
              ("batch4_run_manifest.json", "BATCH4_RUN_MANIFEST"),
          ):
              encoded = base64.b64encode((output / name).read_bytes()).decode("ascii")
              print(f"BEGIN_{marker}_BASE64")
              print(encoded)
              print(f"END_{marker}_BASE64")
          '@ | python - $output
          if ($LASTEXITCODE -ne 0) { throw "Isolated world-data audit comparison failed with exit code $LASTEXITCODE" }

      - name: Run vNext focused regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/run_vnext_validation.py --root . --godot "$env:GODOT_BIN" --suite focused
          if ($LASTEXITCODE -ne 0) { throw "vNext focused validation failed with exit code $LASTEXITCODE" }

      - name: Run production Organization composition test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-organization-world-composition/formal_world_organization_production_composition_test.log'
          $arguments = @(
            '--headless',
            '--audio-driver', 'Dummy',
            '--path', '.',
            '--script', 'res://tests/formal/formal_world_organization_production_composition_test.gd',
            '--log-file', $logPath
          )
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Production Organization composition test failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal production organization composition: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Production Organization composition success summary is missing'
          }

      - name: Run existing Organization composition regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'builds/formal-organization-world-composition/formal_world_organization_composition_test.log'
          $arguments = @(
            '--headless',
            '--audio-driver', 'Dummy',
            '--path', '.',
            '--script', 'res://tests/formal/formal_world_organization_composition_test.gd',
            '--log-file', $logPath
          )
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          Get-Content -LiteralPath $logPath
          if ($process.ExitCode -ne 0) { throw "Existing Organization composition test failed with exit code $($process.ExitCode)" }
          $content = Get-Content -LiteralPath $logPath -Raw
          if ($content -notmatch 'Formal organization composition: ([1-9][0-9]*) checks, 0 failures') {
            throw 'Existing Organization composition success summary is missing'
          }

      - name: Run existing Formal validation baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $formalLog = 'builds/formal-organization-world-composition/formal_validation.log'
          & powershell -ExecutionPolicy Bypass -File tools/run_validation.ps1 -GodotPath $env:GODOT_BIN 2>&1 | Tee-Object -FilePath $formalLog
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Existing Formal validation failed with exit code $exitCode" }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-organization-world-composition-logs
          path: builds/formal-organization-world-composition/*.log
          if-no-files-found: warn
