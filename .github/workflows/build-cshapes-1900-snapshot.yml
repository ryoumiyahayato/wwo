name: Build CShapes 1900 snapshot

on:
  push:
    branches:
      - agent/1900-historical-gis-flags
    paths:
      - "tools/historical_data/build_cshapes_1900_snapshot.py"
      - ".github/workflows/build-cshapes-1900-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/1900-historical-gis-flags
      - name: Install geometry dependency
        run: python3 -m pip install --disable-pip-version-check "shapely==2.1.2"
      - name: Build 1900 snapshot
        run: |
          set -euo pipefail
          python3 tools/historical_data/build_cshapes_1900_snapshot.py
          python3 -m json.tool data/world_map/historical/cshapes_1900_snapshot.json >/dev/null
          test "$(python3 - <<'PY'
import json
with open('data/world_map/historical/cshapes_1900_snapshot.json', encoding='utf-8') as handle:
    print(json.load(handle)['feature_count'])
PY
)" = "151"
      - name: Commit generated provider
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world_map/historical/cshapes_1900_snapshot.json data/world_map/historical/CShapes-2.0-ATTRIBUTION.md
          if git diff --cached --quiet; then
            echo "Snapshot is already current"
            exit 0
          fi
          git commit -m "generate CShapes 1900 historical snapshot"
          git push origin HEAD:agent/1900-historical-gis-flags
