<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WWO · 人物手册交互原型</title>
<style>
:root{--bg:#0b1318;--surface:#111d23;--raised:#17272d;--ink:#eadfc8;--muted:#adbaaf;--gold:#c9ae73;--line:#53605b;--quiet:#263a3e;--focus:#e2ca87;--font-size:16px;--serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;--sans:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--font-size)/1.7 var(--sans)}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus)}button{border:1px solid var(--line);border-radius:3px;background:transparent;color:inherit;padding:8px 13px;cursor:pointer;text-align:left}button:hover{background:var(--raised);border-color:var(--gold)}button[aria-pressed=true],button.active{background:var(--raised);border-color:var(--gold);color:var(--gold)}button.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}button.primary:hover{background:#e0c996}a{color:var(--gold)}p,h1,h2,h3{margin:0}p+p{margin-top:12px}h1,h2,h3{font-family:var(--serif);font-weight:500}h1{font-size:2rem;line-height:1.35}h2{font-size:1.28rem}h3{font-size:1.05rem}.muted,small{color:var(--muted)}small{font-size:.82em}.skip{position:absolute;top:-70px;background:var(--gold);color:var(--bg);padding:8px;z-index:99}.skip:focus{top:5px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 30px;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:center;gap:18px;min-width:0}.wordmark{font:1.6rem var(--serif);letter-spacing:.13em;color:var(--gold)}.divider{height:30px;border-left:1px solid var(--line)}.prototype-note{max-width:500px;text-align:right;font-size:.8rem;color:var(--muted)}.frame{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 87px)}.rail{border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:30px}.person-stamp{padding:0 12px 22px;border-bottom:1px solid var(--line)}.person-stamp strong{font:1.2rem var(--serif);display:block;margin:6px 0}.person-stamp p{font-size:.88rem;color:var(--muted)}.nav{display:grid;gap:8px}.nav button{border-color:transparent;display:flex;align-items:center;gap:12px;min-height:46px}.nav button[aria-current=page]{border-color:var(--line);border-left:3px solid var(--gold);color:var(--gold);background:var(--surface)}.number{font:1rem var(--serif);color:var(--muted);min-width:22px}.rail-note{margin-top:auto;padding:0 12px;font-size:.78rem;color:var(--muted)}main{padding:30px clamp(22px,4vw,58px) 48px;max-width:1300px;width:100%;min-width:0}.page-head{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.page-head p{color:var(--muted);font-size:.9rem;margin-top:8px}.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.context{display:flex;flex-wrap:wrap;gap:9px 26px;padding:12px 0;margin-bottom:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.88rem}.context strong{color:var(--gold);font-weight:500}.sheet-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);gap:40px}.section-label{display:flex;justify-content:space-between;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}.section-label small{flex-shrink:0}.ledger{margin:0}.ledger div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--quiet)}dt{color:var(--muted)}dd{margin:0;min-width:0}.state-note{border-left:2px solid var(--gold);padding:8px 0 8px 18px;margin:20px 0;color:var(--muted);font-size:.92rem}.state-note strong{color:var(--ink);font-weight:500;display:block;margin-bottom:6px}.action-row{padding:16px 0;border-bottom:1px solid var(--quiet)}.action-row strong{display:block;font-weight:500}.action-row p{font-size:.87rem;color:var(--muted);margin:4px 0 12px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:.85rem;padding:6px 11px}.plain-list{padding:0;list-style:none;margin:0}.plain-list li{padding:13px 0;border-bottom:1px solid var(--quiet)}.plain-list p{font-size:.87rem;color:var(--muted);margin-top:4px}.note-box{margin-top:30px;padding:18px 22px;background:var(--surface);border-top:1px solid var(--line);font-size:.87rem;color:var(--muted)}.note-box h3{color:var(--ink);margin-bottom:6px}.row{display:flex;gap:18px;justify-content:space-between;align-items:flex-start}.tag{font-size:.78rem;border:1px solid var(--line);padding:1px 7px;border-radius:2px;color:var(--muted);white-space:nowrap}.tag.runtime{color:var(--gold)}.searchbox{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.searchbox input{min-width:180px;flex:1;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:10px 14px;color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.filters button{font-size:.86rem}.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}.entry h2{display:inline}.entry p{font-size:.9rem;margin-top:7px;color:var(--muted)}.entry small{display:block;margin-top:5px}.entry-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.entry-actions button{font-size:.85rem}.empty{padding:26px 0;color:var(--muted)}.timeline{margin:20px 0 28px;list-style:none;padding:0}.timeline li{display:grid;grid-template-columns:94px 1fr;gap:20px;padding:0 0 24px;position:relative}.timeline time{color:var(--muted);font-size:.9rem}.timeline .step{border-left:1px solid var(--line);padding-left:21px;position:relative}.timeline .step:before{content:"";width:7px;height:7px;background:var(--gold);position:absolute;left:-4px;top:9px;border-radius:50%}.timeline p{font-size:.9rem;color:var(--muted);margin-top:5px}.settings-row{display:grid;grid-template-columns:minmax(170px,.8fr) 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}.settings-row p{color:var(--muted);font-size:.88rem;margin-top:6px}select{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 12px;width:100%;max-width:300px}.switch{display:flex;align-items:center;gap:12px}.switch input{width:20px;height:20px;accent-color:var(--gold)}.status-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.status-strip div{padding:14px;border:1px solid var(--line);background:var(--surface)}.status-strip strong{display:block;font-weight:500;margin-bottom:5px}.status-strip small{display:block}.footer{margin-top:36px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}.count{color:var(--gold)}dialog{padding:0;border:1px solid var(--gold);border-radius:4px;background:var(--surface);color:var(--ink);max-width:min(660px,calc(100vw - 32px));width:660px;max-height:calc(100vh - 40px);overflow:auto}dialog::backdrop{background:#0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 26px;border-bottom:1px solid var(--line)}.dialog-body{padding:24px 26px 30px}.dialog-body p,.dialog-body li{font-size:.94rem}.dialog-body ol{padding-left:1.4em}.dialog-body code{overflow-wrap:anywhere;color:var(--gold);font-size:.85em}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--gold);padding:10px 18px;color:var(--ink);z-index:10;max-width:calc(100vw - 32px);font-size:.9rem;pointer-events:none}.contrast{--bg:#060c10;--surface:#102027;--ink:#fff5df;--muted:#d0dcd3;--line:#829184;--quiet:#51665f;--gold:#edd09a}.large-type{--font-size:18px}body.large-type{font-size:var(--font-size)}.large-type .muted,.large-type small{font-size:.9em}
@media(min-width:1450px){main{padding-top:42px}.sheet-grid{gap:60px}.page-head{margin-bottom:34px}}
@media(max-width:1000px){.nav .number{display:none}.nav button{white-space:nowrap;font-size:.95rem}.frame{grid-template-columns:175px minmax(0,1fr)}.rail{padding:22px 12px}main{padding:26px 24px 40px}.sheet-grid{gap:26px;grid-template-columns:minmax(0,1fr) minmax(215px,.78fr)}.top{padding:16px 22px}.page-head{display:block}.head-tools{justify-content:flex-start;margin-top:16px}.entry{grid-template-columns:1fr}.entry-actions{justify-content:flex-start}.ledger div{grid-template-columns:84px 1fr}.context{gap:6px 14px}.person-stamp{padding-left:6px;padding-right:6px}}
@media(max-width:720px){.frame{display:block}.rail{display:block;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.person-stamp,.rail-note{display:none}.nav{display:flex;overflow-x:auto;gap:5px}.nav button{flex:0 0 auto;white-space:nowrap;font-size:.86rem}.number{display:none}.top{align-items:flex-start;padding:14px 18px}.wordmark{font-size:1.25rem}.divider{display:none}.identity{gap:9px}.prototype-note{font-size:.7rem;max-width:160px}.sheet-grid{display:block}.sheet-grid>section+section{margin-top:28px}main{padding:24px 20px 36px}h1{font-size:1.7rem}.settings-row{grid-template-columns:1fr;gap:12px}.status-strip{grid-template-columns:1fr}.entry-actions{flex-wrap:wrap}.dialog-head,.dialog-body{padding:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#content">跳至正文</a>
<header class="top"><div class="identity"><span class="wordmark">WWO</span><span class="divider"></span><span>人物手册</span></div><p class="prototype-note">界面交互原型 · 演示数据<br>未连接正式世界，不读写游戏存档</p></header>
<div class="frame">
<aside class="rail"><div class="person-stamp"><small>当前扮演</small><strong>示例人物</strong><p>所在地：巴黎<br>身份资料未完整</p></div><nav class="nav" aria-label="人物手册"><button data-page="today" aria-current="page"><span class="number" aria-hidden="true">01</span>今日处境</button><button data-page="plans"><span class="number" aria-hidden="true">02</span>行程与安排</button><button data-page="places"><span class="number" aria-hidden="true">03</span>地点档案</button><button data-page="messages"><span class="number" aria-hidden="true">04</span>消息与记录</button><button data-page="settings"><span class="number" aria-hidden="true">05</span>显示与帮助</button></nav><p class="rail-note">独立于地图的阅读界面。<br>地图、人物所在地与历史资料不互相改写。</p></aside>
<main id="content" tabindex="-1"></main>
</div>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail" aria-label="关闭详情">关闭</button></div><div id="detail-body" class="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// This file is a UI review specimen, not an adapter or a second world runtime.
// All demo:* IDs, statuses and routes below are synthetic; no requests leave the page.
const places = [
 {id:'demo:paris',name:'巴黎',alias:'Paris',kind:'runtime',kindLabel:'正式地点样例',summary:'用于演示人物所在地与地点档案的区分。这里只展示界面结构，不证明其他城市已接入正式行动。',source:'界面样例；正式值应由 spatial_world 按稳定地点 ID 提供。',canTravel:false},
 {id:'demo:nord',name:'巴黎北站',alias:'Gare du Nord',kind:'history',kindLabel:'历史参考地点',summary:'有地图标识不代表已经具备可用的车次、交通连接或旅客席位。',source:'地点名称沿用已有对话；未在本原型取得运行连接。',canTravel:false},
 {id:'demo:westminster',name:'威斯敏斯特桥',alias:'Westminster Bridge',kind:'history',kindLabel:'历史参考地点',summary:'参考建筑与空间行动节点分开。查看桥梁资料不会让人物移动到伦敦。',source:'地点名称沿用已有对话；本页不提供真实桥梁通行结果。',canTravel:false},
 {id:'demo:unresolved',name:'待核实地点',alias:'Unknown place',kind:'unknown',kindLabel:'资料待确认',summary:'缺少正式地点映射，保留未知；不补成“零人口”或“不可居住”。',source:'人工空状态样例，不对应真实地理对象。',canTravel:false}
];
const messages = [
 {id:'demo:message:1',type:'personal',label:'人物消息',title:'行程受阻，等待你决定',body:'示例：已收到一条行程受阻通知。未取得的原因保持未知，不从全知世界状态补写。',when:'示例日期 · 10:15',read:false},
 {id:'demo:message:2',type:'system',label:'运行提示',title:'当前区域仅有较粗地貌',body:'显示精度不足与仍在加载是不同状态。不能把队列结束写成“全部细节已安装”。',when:'示例会话 · 当前',read:false},
 {id:'demo:message:3',type:'history',label:'资料说明',title:'地表覆盖资料不等于开局土地利用',body:'现代地表参考不能自动变成1900年的正式农业、森林或人口事实。',when:'资料年份 · 2021',read:true}
];
const state={page:'today',query:'',placeFilter:'all',messageFilter:'all',bookmarks:new Set(),travel:'none',observed:'未选择其他对象',large:false,contrast:false};
const $=(id)=>document.getElementById(id);
const escapeHTML=(text)=>String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const main=$('content');
let toastTimer=null;
let detailReturnTarget=null;
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true;},2400);}
function modal(title,html){detailReturnTarget=document.activeElement;$('detail-title').textContent=title;$('detail-body').innerHTML=html;if(!$('detail').open)$('detail').showModal();}
function context(){return `<div class="context"><span>人物所在地　<strong>${state.travel==='moving'?'途中（演示）':'巴黎（演示）'}</strong></span><span>当前查看　<strong>${escapeHTML(state.observed)}</strong></span><span>世界时间　<strong>未连接</strong></span></div>`;}
function header(title,subtitle,tools=''){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${tools?`<div class="head-tools">${tools}</div>`:''}</div>`;}
function note(){return '<footer class="footer">本页仅验证阅读与交互。收藏、筛选及已读状态只保留在本次浏览器会话；重新打开后重置。原型不含游戏世界、地图渲染或领域计算。</footer>';}
function navigate(page,focus=true){state.page=page;render();document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(focus)main.focus();}
function today(){const description=state.travel==='moving'?'正在旅行（演示）':state.travel==='blocked'?'行程受阻（演示）':'暂无进行中的行程';return header('今天的处境','先确认自己在哪里、正在做什么，再决定下一步。','<button class="primary" data-go="plans">查看行程与安排</button><button data-command="about">原型说明</button>')+context()+`<div class="sheet-grid"><section><div class="section-label"><h2>我现在的情况</h2><small>未记录的值不补成零</small></div><dl class="ledger"><div><dt>人物</dt><dd>示例人物 <small>· 非历史人物记录</small></dd></div><div><dt>所在地</dt><dd>${state.travel==='moving'?'途中（演示）':'巴黎（演示）'}</dd></div><div><dt>当前行动</dt><dd>${description}</dd></div><div><dt>职业</dt><dd>未提供职业资料</dd></div><div><dt>身体状况</dt><dd>资料未提供</dd></div></dl><div class="state-note"><strong>观察别处，不等于移动人物</strong>查看地点档案不会让人物离开当前位置。明确选择出发后，才会开始一段旅行。</div><div class="tools"><button data-go="places">浏览地点档案</button></div></section><section><div class="section-label"><h2>值得先看的事</h2><small>按用途归类</small></div><div class="action-row"><strong>查看已经发生的结果</strong><p>个人通知、运行提示与资料说明分别阅读。</p><div class="tools"><button data-go="messages">消息与记录</button></div></div><div class="action-row"><strong>整理常用地点</strong><p>查找地点，查看来源，收藏下次还想看的档案。</p><div class="tools"><button data-go="places">查找地点</button></div></div><div class="action-row"><strong>把界面调到看得清</strong><p>字号与对比度都可以调整。长内容使用滚动阅读。</p><div class="tools"><button data-go="settings">显示设置</button></div></div></section></div><aside class="note-box"><h3>已有功能继续使用原入口</h3>个人持有、消费和账务不是重新开发目标。接入时应把现有真实结果接到这里，不另建钱包、库存或计算公式。</aside>`;}
function plans(){const labels={none:'尚无安排',moving:'旅行中',blocked:'到达受阻'};let body='';if(state.travel==='none'){body='<div class="empty"><h2>目前没有进行中的行程</h2><p>空状态要解释目前没有安排，而不是暗示旅行功能不存在。仅在正式服务提供有效目的地和路线时，才显示出发操作。</p></div>';}
else{body=`<ol class="timeline"><li><time>已确认</time><div class="step"><strong>接受一次行程请求</strong><p>开始时间、路线及费用只能来自原行动服务。此处没有生成真实请求。</p></div></li><li><time>正在执行</time><div class="step"><strong>${state.travel==='moving'?'前往登记地点（演示）':'到达条件发生变化（演示）'}</strong><p>${state.travel==='moving'?'预计到达时间未提供；不使用网页计时器伪装世界时间。':'受阻不等于已经取消，也不等于已经退款。需要查看正式服务返回的可用选择。'}</p></div></li><li><time>后续</time><div class="step"><strong>等待正式结果</strong><p>到达、失败或取消各自拥有结果与原因。页面刷新不能再次移动人物或扣款。</p></div></li></ol>`;}
return header('行程与安排','看见行动的过程，而不只是一个“执行成功”。')+context()+`<div class="section-label"><h2>状态样例</h2><small>切换不触发游戏行动</small></div><div class="filters" role="group" aria-label="行动状态样例">${Object.entries(labels).map(([id,label])=>`<button data-travel="${id}" aria-pressed="${state.travel===id}">${label}</button>`).join('')}</div>${body}<div class="tools"><button data-command="request-example">查看接入边界</button><button data-go="messages">查看消息</button></div><aside class="note-box"><h3>长期安排与即时请求分开</h3>已有每日消费安排继续归原服务管理。个人总日程以后需处理出行、活动、等待和冲突；不是再用一个定时器独立推进世界。</aside>`;}
function placeList(){let rows=places.filter(p=>(state.placeFilter==='all'||p.kind===state.placeFilter||(state.placeFilter==='bookmarks'&&state.bookmarks.has(p.id)))&&`${p.name} ${p.alias}`.toLowerCase().includes(state.query.toLowerCase().trim()));return `<p class="muted" style="font-size:.86rem">找到 <span class="count">${rows.length}</span> 个档案样例</p>`+(rows.length?rows.map(p=>`<article class="entry"><div><div class="row"><h2>${escapeHTML(p.name)}</h2><span class="tag ${p.kind}">${p.kindLabel}</span></div><small>${escapeHTML(p.alias)}</small><p>${escapeHTML(p.summary)}</p></div><div class="entry-actions"><button data-place="${p.id}">查看资料</button><button data-pin="${p.id}" aria-pressed="${state.bookmarks.has(p.id)}">${state.bookmarks.has(p.id)?'已收藏':'收藏'}</button></div></article>`).join(''):'<p class="empty">没有符合条件的地点。请修改关键词或取消筛选。</p>');}
function placesPage(){return header('地点档案','一个资料入口，明确区分正式地点、历史参考和未知。')+context()+`<div class="searchbox"><label for="place-search" class="muted">查找地点</label><input id="place-search" type="search" placeholder="例如：巴黎 / Paris" value="${escapeHTML(state.query)}" autocomplete="off"></div><div class="filters" role="group" aria-label="地点类别">${[['all','全部'],['runtime','正式地点样例'],['history','历史参考'],['unknown','待核实'],['bookmarks','我的收藏']].map(([id,label])=>`<button data-place-filter="${id}" aria-pressed="${state.placeFilter===id}">${label}</button>`).join('')}</div><div id="place-results" aria-live="polite">${placeList()}</div>`;}
function messagesPage(){let rows=messages.filter(m=>state.messageFilter==='all'||m.type===state.messageFilter||(state.messageFilter==='unread'&&!m.read));return header('消息与记录','把人物收到的消息、程序状态和历史说明分开。')+context()+`<div class="filters" role="group" aria-label="消息类别">${[['all','全部'],['personal','人物消息'],['system','运行提示'],['history','资料说明'],['unread','未读']].map(([id,label])=>`<button data-message-filter="${id}" aria-pressed="${state.messageFilter===id}">${label}</button>`).join('')}</div>${rows.length?rows.map(m=>`<article class="entry"><div><small>${m.label} · ${m.when} · ${m.read?'已读':'未读'}</small><h2>${m.title}</h2><p>${m.body}</p></div><div class="entry-actions"><button data-read="${m.id}">${m.read?'标为未读':'标为已读'}</button><button data-message="${m.id}">详情</button></div></article>`).join(''):'<p class="empty">此筛选下没有消息。</p>'}<aside class="note-box"><h3>收到消息不等于知道整个世界</h3>人物只看到已经送达且属于其可知范围的内容。当前程序日志不冒充人物通信；“标为已读”也不等于接受或执行行动。</aside>`;}
function settings(){return header('显示与帮助','改阅读体验，不改世界事实。')+`<div class="settings-row"><div><h2>正文大小</h2><p>作用于这个原型，不写入游戏设置。</p></div><div><label for="font-size" class="muted">字号</label><select id="font-size"><option value="normal" ${!state.large?'selected':''}>标准</option><option value="large" ${state.large?'selected':''}>较大</option></select></div></div><div class="settings-row"><div><h2>更高对比度</h2><p>文字与背景更分明；类别仍靠文字而不只靠颜色。</p></div><label class="switch"><input id="contrast" type="checkbox" ${state.contrast?'checked':''}>启用高对比度</label></div><div class="settings-row"><div><h2>键盘操作</h2><p>不把滚轮、右键或定位混成同一个动作。</p></div><p>Tab：移动焦点<br>Enter / 空格：操作按钮<br>Esc：关闭当前详情<br>输入框聚焦时，不响应地图快捷键</p></div><section style="margin-top:28px"><h2>地图状态应该怎么说</h2><div class="status-strip"><div><strong>已就绪</strong><small>当前请求已完成，并符合实际细节等级。</small></div><div><strong>细节准备中</strong><small>保留可用底图；相机继续响应。</small></div><div><strong>此处只有较粗资料</strong><small>这是资料限制，不继续显示假进度。</small></div><div><strong>读取失败</strong><small>说明影响范围，提供真实可用的恢复操作。</small></div></div></section><div class="tools"><button data-command="restore">恢复本页默认设置</button><button data-command="about">阅读原型说明</button></div>`;}
function render(){const active=document.activeElement;const key=active&&active.tagName==='BUTTON'&&main.contains(active)?Object.keys(active.dataset)[0]:null;const value=key?active.dataset[key]:null;main.innerHTML=({today,plans,places:placesPage,messages:messagesPage,settings}[state.page])()+note();if(key){const target=Array.from(main.querySelectorAll('button')).find(b=>b.dataset[key]===value);if(target)target.focus();else main.focus();}}
function placeDetail(id){const p=places.find(x=>x.id===id);if(!p)return;state.observed=p.name;render();const opener=document.querySelector(`[data-place="${p.id}"]`);if(opener)opener.focus();modal(p.name,`<p><span class="tag ${p.kind}">${p.kindLabel}</span></p><p>${escapeHTML(p.summary)}</p><dl class="ledger"><div><dt>人物所在地</dt><dd>${state.travel==='moving'?'途中（演示）':'巴黎（演示）'}</dd></div><div><dt>来源说明</dt><dd>${escapeHTML(p.source)}</dd></div><div><dt>行动资格</dt><dd>本原型不提供旅行请求；历史参考不能冒充正式行动节点。</dd></div><div><dt>样例标识</dt><dd><code>${p.id}</code></dd></div></dl><div class="state-note"><strong>查看已经改变；人物没有移动</strong>未来“地图定位”只请求既有相机定位。“人物前往”必须走正式旅行服务；二者不能共用一个含混按钮。</div>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.go)navigate(b.dataset.go);else if(b.dataset.travel){state.travel=b.dataset.travel;render();}else if(b.dataset.placeFilter){state.placeFilter=b.dataset.placeFilter;render();}else if(b.dataset.messageFilter){state.messageFilter=b.dataset.messageFilter;render();}else if(b.dataset.place)placeDetail(b.dataset.place);else if(b.dataset.pin){const id=b.dataset.pin;state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);render();toast('已更新本次会话收藏；未写入游戏存档。');}else if(b.dataset.read){const m=messages.find(m=>m.id===b.dataset.read);if(m){m.read=!m.read;render();}}else if(b.dataset.message){const m=messages.find(m=>m.id===b.dataset.message);if(m)modal(m.title,`<p>${m.body}</p><p class="muted">这是界面示例，不是从当前游戏读取的消息。已读只是阅读状态，不改变行动或历史资料。</p>`);}else if(b.id==='close-detail')$('detail').close();else if(b.dataset.command==='about'){modal('这份原型做了什么','<p>本文件提出一层人物阅读与操作入口，不替换现有地球、黄铜半球仪、机械时钟或油画菜单。</p><p>可以操作：切换页面、查找地点、查看资料、临时收藏、筛选消息、标记已读、切换行程状态样例、调整正文和对比度。</p><p>没有实现：真实旅行、存档、人物生命模拟、经济、组织或军事计算。所有样例ID以 <code>demo:</code> 开头。</p><p>源码接入前，需要在本机最新工作树核对已有入口。不能拿GitHub的R12界面覆盖本机后续版本。</p>');}else if(b.dataset.command==='request-example'){modal('行程页面的接入边界','<ol><li>从现有 <code>person_travel.view(person_id)</code> 读取当前阶段。</li><li>从现有 <code>person_travel.destinations(person_id)</code> 读取真实可选目的地。</li><li>UI只提交请求；原服务检查路径、条件和结果。</li><li>旅行、等待、取消、到达必须使用同一世界时间。</li><li>未取得合法取消或改道入口时，不显示虚假的可执行按钮。</li></ol><p class="muted">以上方法名来自本次读取的远端代码；本机接入前需要复核最新签名。</p>');}else if(b.dataset.command==='restore'){state.large=false;state.contrast=false;document.body.classList.remove('large-type','contrast');document.documentElement.style.fontSize='16px';render();toast('已恢复原型默认显示。');}});
document.addEventListener('input',e=>{if(e.target.id==='place-search'){state.query=e.target.value;$('place-results').innerHTML=placeList();}});
document.addEventListener('change',e=>{if(e.target.id==='font-size'){state.large=e.target.value==='large';document.body.classList.toggle('large-type',state.large);document.documentElement.style.fontSize=state.large?'18px':'16px';}if(e.target.id==='contrast'){state.contrast=e.target.checked;document.body.classList.toggle('contrast',state.contrast);}});
$('detail').addEventListener('close',()=>{if(detailReturnTarget&&detailReturnTarget.isConnected)detailReturnTarget.focus();else main.focus();});
$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close();}});
render();
</script>
</body>
</html>
